<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Time</title>
<link rel="icon" href="favicon.ico?v=3" sizes="any">
<link rel="icon" type="image/png" href="favicon-32x32.png?v=3" sizes="32x32">
<link rel="icon" type="image/png" href="favicon-16x16.png?v=3" sizes="16x16">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<style>
:root {
  --page:    #eef3f9;
  --hdr:     #ffffff;
  --card:    #ffffff;
  --lpanel:  #f4f8fc;
  --text:    #18303f;
  --dim:     #5a7a90;
  --border:  rgba(30,80,130,.12);
  --shadow:  0 2px 14px rgba(30,80,130,.09);
  --accent:  #1260a0;
  --acc2:    #1580cc;
  --orange:  #d05808;
  --orng-gl: rgba(208,88,8,.7);
  --sld-track:#d6e7f5;
  --btn-bg:  #f4f8fc;
  --btn-bd:  rgba(30,80,130,.20);
  --wall-bg: #ffffff;

  /* ── TAPE COLOURS (pastel day / night) ── */
  --c-day:   #dcf0fc;   /* bright airy pastel sky blue */
  --c-night: #6282aa;   /* bright pastel periwinkle-slate */
  --c-day-t: #1f4b70;   /* label on day */
  --c-nit-t: #f2f8ff;   /* label on night */
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

body{
  background:var(--page);color:var(--text);
  font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  min-height:100vh;display:flex;flex-direction:column;
}

/* ── HEADER ── */
.hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:11px 22px;background:var(--hdr);
  box-shadow:0 1px 0 var(--border),0 2px 10px rgba(30,80,130,.07);
  position:sticky;top:0;z-index:100;
}
.logo{font-size:17px;font-weight:700}
.logo em{color:var(--acc2);font-style:normal}
.btn-now{
  background:var(--accent);color:#fff;border:none;
  padding:6px 15px;border-radius:20px;cursor:pointer;
  font-size:12px;font-weight:700;transition:background .2s;
}
.btn-now:hover{background:var(--acc2)}
.hdr-actions{display:flex;align-items:center;gap:8px}
.btn-link{
  background:var(--btn-bg);color:var(--acc2);border:1px solid var(--btn-bd);
  padding:5px 14px;border-radius:20px;text-decoration:none;
  font-size:12px;font-weight:700;transition:all .2s;
}
.btn-link:hover{background:var(--lpanel);border-color:var(--acc2)}
.theme-wrap{position:relative}
.btn-theme{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--btn-bg);color:var(--text);
  border:1px solid var(--btn-bd);
  padding:5px 12px;border-radius:20px;cursor:pointer;
  font-size:12px;font-weight:700;transition:all .15s;
}
.btn-theme:hover{border-color:var(--acc2)}
.theme-dot{
  width:10px;height:10px;border-radius:50%;flex-shrink:0;
  border:1px solid rgba(128,128,128,.35);
}
.theme-menu{
  position:absolute;top:calc(100% + 6px);right:0;z-index:250;
  min-width:176px;max-height:440px;overflow-y:auto;
  background:var(--hdr);border:1px solid var(--border);
  border-radius:12px;padding:6px;
  box-shadow:0 12px 32px rgba(0,0,0,.22);
}
.theme-menu.hidden{display:none}
.theme-opt{
  width:100%;display:flex;align-items:center;gap:10px;
  padding:8px 10px;border:none;border-radius:8px;
  background:transparent;color:var(--text);
  font-size:13px;font-weight:500;cursor:pointer;text-align:left;
  transition:background .12s;
}
.theme-opt:hover{background:var(--lpanel)}
.theme-opt.active{font-weight:700}
.theme-opt-dot{
  width:14px;height:14px;border-radius:50%;flex-shrink:0;
  border:1px solid rgba(128,128,128,.35);
}
.theme-opt-chk{margin-left:auto;color:var(--acc2);font-weight:700}

/* ── NEWSROOM WALL CLOCKS ── */
.wallsec{
  background:var(--wall-bg);
  border-bottom:1px solid var(--border);
  box-shadow:0 2px 10px rgba(30,80,130,.05);
  padding:0;
}
.wallwrap{
  position:relative;
  width:100%;
  aspect-ratio:2.25/1;
  overflow:hidden;
}
#wallMapCanvas{
  display:block;
  width:100%;
  height:100%;
}
#wallLeaders{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
}
#wallClocks{
  position:absolute;
  inset:0;
  pointer-events:none;
}
.wclock{
  position:absolute;
  transform:translate(-50%,-50%);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  pointer-events:auto;
}
.wclock-svg{
  display:block;
  filter:drop-shadow(0 4px 10px rgba(20,40,65,.18));
}
.wclock-lbl{
  font-size:clamp(11px,1.25vw,16px);
  font-weight:700;
  color:#182b3a;
  letter-spacing:.2px;
  white-space:nowrap;
  background:rgba(255,255,255,.82);
  padding:2px 8px;
  border-radius:10px;
  line-height:1.25;
}
#wc-wrap-seoul .wclock-lbl{
  color:#0e6b53;
  background:rgba(234,249,243,.92);
  border:1px solid rgba(14,107,83,.32);
}
.wclock-dst{
  position:relative;
  top:-0.48em;
  vertical-align:baseline;
  margin-left:2px;
  font-size:max(8.5px,.6em);
  font-weight:700;
  color:var(--orange);
  line-height:0;
  letter-spacing:.2px;
}
.wclock-dst[hidden]{display:none!important}
.wclock-dt{
  display:flex;
  flex-direction:column;
  align-items:center;
  background:rgba(255,255,255,.84);
  padding:2px 8px 3px;
  border-radius:8px;
  line-height:1.2;
}
.wclock-date{
  font-size:clamp(10px,1vw,13px);
  color:var(--dim);
  white-space:nowrap;
}
.wclock-time{
  font-size:clamp(11px,1.15vw,15px);
  font-weight:700;
  color:var(--accent);
  font-variant-numeric:tabular-nums;
  letter-spacing:.3px;
  white-space:nowrap;
}

/* ── CITY SECTION ── */
.csec{padding:10px 18px 4px}

/* drag handle */
.dhandle{
  flex-shrink:0;width:22px;
  display:flex;align-items:center;justify-content:center;
  cursor:grab;color:var(--dim);font-size:13px;letter-spacing:1px;
  background:var(--lpanel);border-right:1px solid var(--border);
  opacity:.45;transition:opacity .15s;user-select:none;
}
.dhandle:hover{opacity:.9}
.dhandle:active{cursor:grabbing}

/* seoul slide distinct colour */
.card[data-id="seoul"]{
  --c-day:   #daf3ea;
  --c-night: #4d7d74;
  --c-day-t: #165244;
  --c-nit-t: #f0fbf8;
  border-color:rgba(29,126,102,.32);
}
.card[data-id="seoul"] .dhandle{
  background:#eaf6f2;
  color:#3c7566;
}
.card[data-id="seoul"] .cleft{
  background:linear-gradient(180deg,#f2fbf8 0%,#e7f5ef 100%);
  box-shadow:inset 3px 0 0 #1e886c;
}
.card[data-id="seoul"] .cname{color:#125444}
.card[data-id="seoul"] .tc.day .ttick{background:rgba(22,82,68,.28)}
.card[data-id="seoul"] .tc.night .ttick{background:rgba(240,251,248,.42)}

/* drag states */
.card.dragging{opacity:.35;box-shadow:none}
.card.drag-over-top{border-top:2px solid var(--accent)}
.card.drag-over-bot{border-bottom:2px solid var(--accent)}

.card{
  display:flex;align-items:stretch;
  margin-bottom:7px;
  background:var(--card);border:1px solid var(--border);
  border-radius:10px;box-shadow:var(--shadow);
  overflow:hidden;min-height:72px;
}

/* left info */
.cleft{
  flex-shrink:0;width:168px;
  display:flex;flex-direction:column;justify-content:center;gap:3px;
  padding:9px 11px 9px 13px;
  background:var(--lpanel);border-right:1px solid var(--border);
}
.cr1{display:flex;align-items:center;gap:5px}
.cflag{font-size:17px;line-height:1}
.cnames{flex:1;min-width:0}
.cname{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccountry{font-size:10px;color:var(--dim)}
.brm{
  width:20px;height:20px;flex-shrink:0;
  background:transparent;border:1px solid rgba(208,88,8,.35);
  color:var(--orange);border-radius:50%;cursor:pointer;
  font-size:15px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s;
}
.brm:hover{background:rgba(208,88,8,.12)}
.cr2{display:flex;align-items:baseline;gap:4px}
.chm{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.cs{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.cr3{font-size:10px;color:var(--dim)}
.card.is-dst .cleft{
  background:linear-gradient(180deg,#fffbf0 0%,#faf4e4 100%);
  box-shadow:inset 3px 0 0 #de8912;
}
.cr2 .dst-badge{align-self:center;margin-left:auto}
.dst-badge{
  display:inline-flex;align-items:center;gap:2.5px;
  padding:1.5px 5.5px;border-radius:999px;
  background:#fff2cc;border:1px solid rgba(212,130,10,.45);
  color:#9e5300;font-size:9.5px;font-weight:700;
  line-height:1.15;letter-spacing:.35px;white-space:nowrap;
  flex-shrink:0;vertical-align:middle;
}
.dst-badge[hidden]{display:none!important}
.dst-ico{width:9px;height:9px;flex-shrink:0;display:block}
.dst-badge-sm{padding:1px 5px;font-size:9px;gap:2px}
.dst-badge-sm .dst-ico{width:8.5px;height:8.5px}

/* ── TAPE RIGHT PANEL ── */
.cright{
  flex:1;position:relative;overflow:hidden;
  cursor:ew-resize;user-select:none;
  background:var(--c-night);
}

/* ── CENTRE MARK — fixed at 50%, always ── */
.cmark{
  position:absolute;left:50%;top:0;bottom:0;
  transform:translateX(-50%);
  width:3px;
  pointer-events:none;z-index:20;
  background:var(--orange);
  box-shadow:0 0 10px var(--orng-gl),0 0 3px rgba(255,255,255,.4);
}
/* top/bottom triangles */
.cmark::before,.cmark::after{
  content:'';position:absolute;left:50%;
  transform:translateX(-50%);
  width:0;height:0;
}
.cmark::before{
  top:0;
  border-left:6px solid transparent;border-right:6px solid transparent;
  border-top:9px solid var(--orange);
}
.cmark::after{
  bottom:0;
  border-left:6px solid transparent;border-right:6px solid transparent;
  border-bottom:9px solid var(--orange);
}

/* ── TAPE STRIP ── */
.tape{
  position:absolute;top:0;bottom:0;left:0;
  display:flex;align-items:stretch;
  will-change:transform;
}
/* real-time smooth drift */
.tape.drift { transition:transform 1.2s linear }
/* slider/drag: quick snap */
.tape.quick { transition:transform .25s ease }
/* initial placement: no transition */
.tape.instant { transition:none }

/* ── HOUR CELL ── */
.tc{
  flex-shrink:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;
  padding-top:5px;
  border-right:1px solid rgba(255,255,255,.22);
  position:relative;
}
/* period colours: day / night only */
.tc.day  { background:var(--c-day)   }
.tc.night{ background:var(--c-night) }

/* midnight cell: brighter left border */
.tc.mid { border-left:2px solid rgba(255,255,255,.35) }

/* hour label */
.tlbl{
  font-size:10px;font-weight:600;
  line-height:1;white-space:nowrap;
  pointer-events:none;
  margin-bottom:auto;
}
.tc.day   .tlbl{ color:var(--c-day-t) }
.tc.night .tlbl{ color:var(--c-nit-t) }

/* tick at bottom */
.ttick{
  position:absolute;bottom:3px;
  width:1px;
  flex-shrink:0;
}
.tc.day   .ttick{ background:rgba(30,80,120,.25) }
.tc.night .ttick{ background:rgba(240,248,255,.38) }
.tc.maj .ttick  { opacity:.7 }
.tc.mid         { border-left:2px solid rgba(255,255,255,.68) }
.tc.mid .ttick  { opacity:1 }

/* ── ADD ROW ── */
.addrow{
  display:flex;align-items:center;gap:8px;
  padding:7px 0 5px;
}
.badd{
  width:27px;height:27px;flex-shrink:0;
  background:var(--card);border:2px solid var(--acc2);
  color:var(--acc2);border-radius:50%;cursor:pointer;
  font-size:20px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 5px rgba(30,80,130,.14);
  transition:all .15s;
}
.badd:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.addlbl{font-size:12px;color:var(--dim);cursor:pointer}
.addlbl:hover{color:var(--acc2)}

/* ── SLIDER ── */
.sldsec{
  padding:8px 18px 11px;
  background:var(--hdr);
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
  box-shadow:0 -1px 6px rgba(30,80,130,.05);
}
.srow{display:flex;align-items:center;gap:10px}
.slbl{font-size:10px;color:var(--dim);white-space:nowrap}

input[type=range]{
  -webkit-appearance:none;appearance:none;
  flex:1;height:5px;border-radius:3px;
  background:var(--sld-track);outline:none;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:20px;height:20px;border-radius:50%;
  background:var(--orange);
  box-shadow:0 0 0 3px rgba(208,88,8,.18);
  cursor:pointer;transition:box-shadow .15s;
}
input[type=range]::-webkit-slider-thumb:hover{box-shadow:0 0 0 5px rgba(208,88,8,.28)}
input[type=range]::-moz-range-thumb{
  width:20px;height:20px;border-radius:50%;
  background:var(--orange);border:none;cursor:pointer;
}

/* ── BEZEL WORLD TIMER ── */
.bzsec{padding:9px 18px 22px;display:flex;flex-direction:column;align-items:center}
.bztitle{font-size:10px;color:var(--dim);letter-spacing:.5px;margin-bottom:8px;font-weight:600;align-self:flex-start}
.bzwrap{width:min(100%,520px)}
#bzSVG{width:100%;height:auto;display:block;cursor:grab;user-select:none;touch-action:none;filter:drop-shadow(0 10px 22px rgba(15,35,58,.22))}
#bzSVG:active{cursor:grabbing}
#bzSVG2{width:100%;height:auto;display:block;cursor:grab;user-select:none;touch-action:none;filter:drop-shadow(0 10px 22px rgba(15,35,58,.22))}
#bzSVG2:active{cursor:grabbing}

/* ── SEARCH ── */
.overlay{
  position:fixed;inset:0;
  background:rgba(15,40,65,.45);backdrop-filter:blur(4px);
  z-index:300;display:flex;align-items:flex-start;justify-content:center;
  padding-top:65px;
}
.overlay.hidden{display:none}
.sbox{
  background:var(--hdr);border:1px solid var(--border);
  border-radius:12px;width:min(92vw,480px);max-height:min(82vh,580px);
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 24px 60px rgba(15,40,65,.2);
}
.shdr{
  display:flex;align-items:center;gap:8px;
  padding:12px 15px;border-bottom:1px solid var(--border);
}
.sinp{
  background:transparent;border:none;color:var(--text);
  font-size:14px;outline:none;flex:1;
}
.sinp::placeholder{color:var(--dim)}
.scls{background:none;border:none;color:var(--dim);font-size:18px;cursor:pointer}
.scls:hover{color:var(--text)}
.sregbar{
  display:flex;flex-wrap:wrap;gap:5px;
  padding:8px 12px;background:var(--lpanel);
  border-bottom:1px solid var(--border);
}
.sregbtn{
  border:1px solid var(--btn-bd);background:var(--card);color:var(--dim);
  border-radius:14px;padding:3px 9px;font-size:11px;font-weight:600;
  cursor:pointer;transition:all .12s;white-space:nowrap;
}
.sregbtn:hover{border-color:var(--acc2);color:var(--acc2)}
.sregbtn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.sres{overflow-y:auto;flex:1}
.sgrp{
  position:sticky;top:0;z-index:2;
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 15px;background:var(--lpanel);
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
  font-size:11px;font-weight:700;color:var(--text);letter-spacing:.2px;
}
.sgrpcnt{font-size:10px;font-weight:600;color:var(--dim)}
.sempty{padding:20px;text-align:center;color:var(--dim);font-size:12px}
.sitem{
  display:flex;align-items:center;gap:10px;
  padding:9px 15px;cursor:pointer;
  border-bottom:1px solid var(--border);transition:background .1s;
}
.sitem:hover{background:var(--lpanel)}
.sflag{font-size:19px}
.sinf{flex:1}
.sname{font-size:13px;font-weight:600}
.scountry{font-size:10px;color:var(--dim)}
.smeta{display:flex;align-items:center;gap:6px;flex-shrink:0}
.stime{font-size:14px;font-weight:700;color:var(--acc2)}

/* ── DARK THEME OVERRIDES ── */
body.theme-dark .wclock-lbl,
body.theme-dark .wclock-dt{background:rgba(16,22,30,.86)}
body.theme-dark .wclock-lbl{color:var(--text)}
body.theme-dark .wclock-time{color:var(--acc2)}
body.theme-dark #wc-wrap-seoul .wclock-lbl{
  color:#63e6be;background:rgba(12,38,32,.9);border-color:rgba(99,230,190,.38);
}
body.theme-dark .card[data-id="seoul"]{
  --c-day:#d6efe6;--c-night:#1d4a41;--c-day-t:#11382d;--c-nit-t:#eafaf4;
  border-color:rgba(99,230,190,.32);
}
body.theme-dark .card[data-id="seoul"] .dhandle{background:#122923;color:#63e6be}
body.theme-dark .card[data-id="seoul"] .cleft{
  background:linear-gradient(180deg,#152e27 0%,#10241f 100%);
  box-shadow:inset 3px 0 0 #38b896;
}
body.theme-dark .card[data-id="seoul"] .cname{color:#63e6be}
body.theme-dark .card.is-dst .cleft{
  background:linear-gradient(180deg,#2a2316 0%,#221c12 100%);
  box-shadow:inset 3px 0 0 #e5a93b;
}
body.theme-dark .dst-badge{
  background:rgba(245,180,50,.18);border-color:rgba(245,180,50,.45);color:#ffd166;
}
body.theme-dark .tc.day .ttick{background:rgba(20,40,60,.25)}
body.theme-dark .tc.night .ttick{background:rgba(240,248,255,.32)}
</style>
</head>
<body>

<div class="hdr">
  <div class="logo">🌍 <em>World</em> Time</div>
  <div class="hdr-actions">
    <a class="btn-link" href="wall.html">뉴스룸 벽시계</a>
    <div class="theme-wrap" id="themeWrap">
      <button type="button" class="btn-theme" id="btnTheme" onclick="toggleThemeMenu(event)" aria-haspopup="true" aria-expanded="false" title="색상 테마 변경">
        <span class="theme-dot" id="themeDot"></span>
        <span>테마</span>
      </button>
      <div class="theme-menu hidden" id="themeMenu" role="menu"></div>
    </div>
    <button class="btn-now" onclick="resetToNow()">현재 시각</button>
  </div>
</div>

<div class="wallsec">
  <div class="wallwrap">
    <canvas id="wallMapCanvas"></canvas>
    <svg id="wallLeaders"></svg>
    <div id="wallClocks"></div>
  </div>
</div>

<div class="csec">
  <div id="cityList"></div>
  <div class="addrow">
    <button class="badd" onclick="openSearch()" title="도시 추가">+</button>
    <span class="addlbl" onclick="openSearch()">도시 추가</span>
  </div>
</div>

<div class="sldsec">
  <div class="srow">
    <span class="slbl">−24h</span>
    <input type="range" id="slider" min="-1440" max="1440" step="1" value="0"
           oninput="onSlider(this.value)">
    <span class="slbl">+24h</span>
  </div>
</div>

<div style="display:flex;gap:16px;flex-wrap:wrap;width:100%;">
  <div class="bzsec" style="flex:1;min-width:300px;">
    <div class="bztitle">WORLD TIMER BEZEL I — City Ring</div>
    <div class="bzwrap">
      <svg id="bzSVG" viewBox="-266 -266 532 532" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>
  <div class="bzsec" style="flex:1;min-width:300px;">
    <div class="bztitle">WORLD TIMER BEZEL II — Dial</div>
    <div class="bzwrap">
      <svg id="bzSVG2" viewBox="-266 -266 532 532" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>
</div>

<div class="overlay hidden" id="overlay" onclick="bgClick(event)">
  <div class="sbox">
    <div class="shdr">

let activeTheme = WATCH_THEMES[0];

function getThemeById(id){
  return WATCH_THEMES.find(t=>t.id===id) || WATCH_THEMES[0];
}

function hexToRgba(hex,alpha){
  if(!hex||hex[0]!=='#'||hex.length!==7)return hex;
  const r=parseInt(hex.slice(1,3),16);
  const g=parseInt(hex.slice(3,5),16);
  const b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function applyTheme(id, persist=true){
  const t=getThemeById(id);
  activeTheme=t;
  const root=document.documentElement;
  if(root&&root.style&&root.style.setProperty){
    root.style.setProperty('--page',t.pageBackground);
    root.style.setProperty('--hdr',t.topBarBackground);
    root.style.setProperty('--card',t.topBarBackground);
    root.style.setProperty('--lpanel',t.themeButtonContainerColor);
    root.style.setProperty('--text',t.textPrimaryColor);
    root.style.setProperty('--dim',t.textDimColor);
    root.style.setProperty('--border',t.dividerColor);
    root.style.setProperty('--shadow',t.isDark?'0 2px 14px rgba(0,0,0,.38)':'0 2px 14px rgba(30,80,130,.09)');
    root.style.setProperty('--accent',t.primaryButtonColor);
    root.style.setProperty('--acc2',t.titleAccentColor);
    root.style.setProperty('--orange',t.sliderActiveColor);
    root.style.setProperty('--orng-gl',hexToRgba(t.sliderActiveColor,0.7));
    root.style.setProperty('--sld-track',t.sliderInactiveColor);
    root.style.setProperty('--c-day',t.tapeDay);
    root.style.setProperty('--c-night',t.tapeNight);
    root.style.setProperty('--c-day-t',t.tapeDayText);
    root.style.setProperty('--c-nit-t',t.tapeNightText);
    root.style.setProperty('--btn-bg',t.themeButtonContainerColor);
    root.style.setProperty('--btn-bd',t.themeButtonBorderColor);
    root.style.setProperty('--wall-bg',t.topBarBackground);
  }
  if(document.body&&document.body.classList){
    document.body.classList.toggle('theme-dark',t.isDark);
  }
  const dot=document.getElementById('themeDot');
  if(dot)dot.style.background=t.previewColor;
  if(persist){
    try{localStorage.setItem(THEME_STORAGE_KEY,t.id);}catch(e){}
  }
  renderThemeMenu();
  if(typeof mapTopo!=='undefined'&&mapTopo)drawWallMap();
  if(typeof buildBezelSVG==='function'){
    buildBezelSVG();
    buildBezelSVG2();
  }
}

function loadThemeFromStorage(){
  let saved=null;
  try{saved=localStorage.getItem(THEME_STORAGE_KEY);}catch(e){}
  applyTheme(saved,false);
}

function renderThemeMenu(){
  const menu=document.getElementById('themeMenu');
  if(!menu)return;
  menu.innerHTML=WATCH_THEMES.map(t=>{
    const active=t.id===activeTheme.id;
    return `<button type="button" class="theme-opt${active?' active':''}" role="menuitemradio" aria-checked="${active}" onclick="selectTheme('${t.id}')">
      <span class="theme-opt-dot" style="background:${t.previewColor}"></span>
      <span>${t.displayName}</span>
      ${active?'<span class="theme-opt-chk">✓</span>':''}
    </button>`;
  }).join('');
}

function toggleThemeMenu(e){
  if(e)e.stopPropagation();
  const menu=document.getElementById('themeMenu');
  const btn=document.getElementById('btnTheme');
  if(!menu)return;
  const open=menu.classList.contains('hidden');
  if(open)renderThemeMenu();
  menu.classList.toggle('hidden',!open);
  if(btn)btn.setAttribute('aria-expanded',String(open));
}

function closeThemeMenu(){
  const menu=document.getElementById('themeMenu');
  const btn=document.getElementById('btnTheme');
  if(menu)menu.classList.add('hidden');
  if(btn)btn.setAttribute('aria-expanded','false');
}

function selectTheme(id){
  closeThemeMenu();
  applyTheme(id,true);
}

  localStorage.setItem(STORAGE_KEY, JSON.stringify(cities));

function loadCitiesFromStorage(){

    }catch(e){
      console.error('Failed to load cities:', e);
    }
  }
}

/* ══════════════════════════════════
   TIME HELPERS
══════════════════════════════════ */
const DST_ICON='<svg class="dst-ico" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="2.4" fill="currentColor"/><g stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><line x1="6" y1="0.8" x2="6" y2="2.2"/><line x1="6" y1="9.8" x2="6" y2="11.2"/><line x1="0.8" y1="6" x2="2.2" y2="6"/><line x1="9.8" y1="6" x2="11.2" y2="6"/><line x1="2.3" y1="2.3" x2="3.3" y2="3.3"/><line x1="8.7" y1="8.7" x2="9.7" y2="9.7"/><line x1="9.7" y1="2.3" x2="8.7" y2="3.3"/><line x1="3.3" y1="8.7" x2="2.3" y2="9.7"/></g></svg>';
const dstYearCache=new Map();

function selTime(){ return Date.now() + offsetMin*60000; }

function tzOffsetMin(ts,tz){
  const t=Math.floor(ts/60000)*60000;
  const fmt=new Intl.DateTimeFormat('en-US',{
    timeZone:tz,hour12:false,
    year:'numeric',month:'2-digit',day:'2-digit',
    hour:'2-digit',minute:'2-digit'
  });
  const p={};
  fmt.formatToParts(new Date(t)).forEach(x=>p[x.type]=x.value);
  let h=parseInt(p.hour,10);if(h===24)h=0;
  const localUtc=Date.UTC(+p.year,+p.month-1,+p.day,h,+p.minute);
  return Math.round((localUtc-t)/60000);
}

function isDST(tz,ts=selTime(),curOff){
  const d=new Date(ts);
  const y=d.getUTCFullYear();
  const key=`${tz}|${y}`;
  let ref=dstYearCache.get(key);
  if(!ref){
    const jan=tzOffsetMin(Date.UTC(y,0,1,12),tz);
    const jul=tzOffsetMin(Date.UTC(y,6,1,12),tz);
    const nextJan=tzOffsetMin(Date.UTC(y+1,0,1,12),tz);
    ref={jan,jul,nextJan,std:Math.min(jan,jul)};
    dstYearCache.set(key,ref);
  }
  if(ref.jan===ref.jul)return false;
  const cur=curOff!==undefined?curOff:tzOffsetMin(ts,tz);
  if(ref.jan===ref.nextJan)return cur>ref.std;
  const part=new Intl.DateTimeFormat('en-US',{
    timeZone:tz,timeZoneName:'long'
  }).formatToParts(d).find(x=>x.type==='timeZoneName');
  return /\b(Daylight|Summer)\b/i.test(part?part.value:'');
}

function localHourAt(ts, tz){
  return parseInt(
    new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'2-digit',hour12:false}).format(new Date(ts)),
    10) % 24;
}

function getParts(tz){
  const tsSec=Math.floor(selTime()/1000)*1000;
  const now=new Date(tsSec);
  const fmt=new Intl.DateTimeFormat('en-US',{
    timeZone:tz,hour12:false,
    year:'numeric',month:'2-digit',day:'2-digit',
    hour:'2-digit',minute:'2-digit',second:'2-digit',
    timeZoneName:'short'
  });
  const p={};
  fmt.formatToParts(now).forEach(x=>p[x.type]=x.value);
  let h=parseInt(p.hour,10);if(h===24)h=0;
  const m=parseInt(p.minute,10),s=parseInt(p.second,10);
  const wd=new Intl.DateTimeFormat('ko-KR',{timeZone:tz,weekday:'short'}).format(now).replace('요일','');
  const wdEn=new Intl.DateTimeFormat('en-US',{timeZone:tz,weekday:'short'}).format(now);
  const monEn=new Intl.DateTimeFormat('en-US',{timeZone:tz,month:'short'}).format(now);
  const tzAbbr=p.timeZoneName||'';
  const localUtc=Date.UTC(+p.year,+p.month-1,+p.day,h,m,s);
  const curOff=Math.round((localUtc-tsSec)/60000);
  return{
    h,m,s,
    timeStr:`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`,
    secStr:String(s).padStart(2,'0'),
    dateStr:`${p.month}-${p.day}(${wd})`,
    dateStrEn:`${monEn} ${p.day} (${wdEn})`,
    tzAbbr,
    dst:isDST(tz,tsSec,curOff)
  };
}

/* colour period: day (06–17) / night (18–05) */
function period(h){ return (h>=6 && h<18) ? 'day' : 'night'; }

/* ══════════════════════════════════
   STRIP BUILDER
   120 cells, one per hour.
   Labels on EVERY cell (user request).
   refTs anchor means all cities use
   the SAME translateX formula.
══════════════════════════════════ */
function initRefTs(){
  refTs = Math.floor(Date.now()/3600000)*3600000 - STRIP_LEAD*3600000;
}

function buildStrip(city){
  const W=HOUR_W;
  let html='';
  for(let i=0;i<STRIP_TOT;i++){
    const ts=refTs+i*3600000;
    const h=localHourAt(ts,city.tz);
    const per=period(h);
    const isMaj=(h%6===0);
    const isMid=(h===0);
    const tickH=isMid?12:isMaj?9:5;
    const cls=`tc ${per}${isMaj?' maj':''}${isMid?' mid':''}`;
    html+=`<div class="${cls}" style="width:${W}px">
      <span class="tlbl">${String(h).padStart(2,'0')}</span>
      <div class="ttick" style="height:${tickH}px"></div>
    </div>`;
  }
  return html;
}

/* ══════════════════════════════════
   translateX — SAME for every city:
   centre of tape = selTime()
══════════════════════════════════ */
function calcTX(containerW){
  const hoursSinceRef = (selTime()-refTs)/3600000;
  return containerW/2 - hoursSinceRef*HOUR_W;
}

function applyTX(mode){
  // mode: 'instant' | 'quick' | 'drift'
  document.querySelectorAll('.tape').forEach(tape=>{
    const cright=tape.parentElement;
    if(!cright)return;
    const tx=calcTX(cright.offsetWidth);
    tape.classList.remove('instant','quick','drift');
    tape.classList.add(mode);
    tape.style.transform=`translateX(${tx.toFixed(2)}px)`;
  });
}

function buildCard(id){
  const city=DB.find(c=>c.id===id);
  if(!city)return'';
  const p=getParts(city.tz);
  return`<div class="card${p.dst?' is-dst':''}" data-id="${id}"
    ondragover="cardDragOver(event,'${id}')"
    ondragleave="cardDragLeave(event)"
    ondrop="cardDrop(event,'${id}')">
    <div class="dhandle" draggable="true"
         ondragstart="cardDragStart(event,'${id}')"
         ondragend="cardDragEnd()">⠿</div>
    <div class="cleft">
      <div class="cr1">
        <span class="cflag">${city.flag}</span>
        <div class="cnames">
          <div class="cname">${city.name}</div>
          <div class="ccountry">${city.country}</div>
        </div>
        <button class="brm" onclick="removeCity('${id}')" title="삭제">−</button>
      </div>
      <div class="cr2">
        <span class="chm" data-id="${id}-hm">${p.timeStr}</span>
        <span class="cs"  data-id="${id}-s">:${p.secStr}</span>
        <span class="dst-badge" data-id="${id}-dst" title="서머타임(DST) 적용 중"${p.dst?'':' hidden'}>${DST_ICON}DST</span>
      </div>
      <div class="cr3" data-id="${id}-r3">${p.dateStr} · ${p.tzAbbr}</div>
    </div>
    <div class="cright"
         onmousedown="dragStart(event)"
         ontouchstart="dragStart(event)">
      <!-- orange centre line — fixed at 50%, never moves -->
      <div class="cmark"></div>
      <!-- scrolling tape strip -->
      <div class="tape instant" id="tape-${id}">${buildStrip(city)}</div>
    </div>
  </div>`;
}

function renderList(){
  const el=document.getElementById('cityList');
  if(!cities.length){
    el.innerHTML=`<div style="padding:20px 0;text-align:center;color:var(--dim);font-size:12px">
      + 버튼으로 도시를 추가하세요</div>`;
    return;
  }
  el.innerHTML=cities.map(buildCard).join('');
  requestAnimationFrame(()=>{
    applyTX('instant');
    requestAnimationFrame(()=>{
      // switch to drift after placement
      document.querySelectorAll('.tape').forEach(t=>{
        t.classList.remove('instant');t.classList.add('drift');
      });
    });
  });
}

  if(bzAnim){cancelAnimationFrame(bzAnim);bzAnim=null;}
  if(bzAnim2){cancelAnimationFrame(bzAnim2);bzAnim2=null;}
  applyTX('quick');
  updateLabels();
  bzSyncSlots();
  bzUpdate(true);
  bzUpdate2(true);
  updateWallClocks();
}
function updateLabels(){
  cities.forEach(id=>{
    const city=DB.find(c=>c.id===id);if(!city)return;
    const p=getParts(city.tz);
    const card=document.querySelector(`.card[data-id="${id}"]`);
    const hm=document.querySelector(`[data-id="${id}-hm"]`);
    const s =document.querySelector(`[data-id="${id}-s"]`);
    const dst=document.querySelector(`[data-id="${id}-dst"]`);
    const r3=document.querySelector(`[data-id="${id}-r3"]`);
    if(card)card.classList.toggle('is-dst',p.dst);
    if(hm)hm.textContent=p.timeStr;
    if(s) s.textContent=`:${p.secStr}`;
    if(dst)dst.hidden=!p.dst;
    if(r3)r3.textContent=`${p.dateStr} · ${p.tzAbbr}`;
  });
}
function resetToNow(){
  offsetMin=0;
  document.getElementById('slider').value=0;
  const targetDeg=bzUtcHours(Date.now())*15;
  applyTX('quick');
  updateLabels();
  bzSyncSlots();
  bzAnimateTo(targetDeg);
  bzAnimateTo2(((-targetDeg)%360+360)%360);
  updateWallClocks();
}

/* ══════════════════════════════════
   TAPE DRAG
══════════════════════════════════ */
function dragStart(e){
  e.preventDefault();
  drag={startX:e.touches?e.touches[0].clientX:e.clientX,
        startOff:offsetMin,
        w:e.currentTarget.offsetWidth};
  document.addEventListener('mousemove',dragMove);
  document.addEventListener('mouseup',  dragEnd);
  document.addEventListener('touchmove',dragMove,{passive:false});
  document.addEventListener('touchend', dragEnd);
}
function dragMove(e){
  if(!drag)return;e.preventDefault();
  const x=e.touches?e.touches[0].clientX:e.clientX;
  // drag left = move forward in time (tape moves left = future comes to centre)
  const dMin=-Math.round((x-drag.startX)/drag.w*24*60);
  offsetMin=Math.max(-1440,Math.min(1440,drag.startOff+dMin));
  document.getElementById('slider').value=offsetMin;
  if(bzAnim){cancelAnimationFrame(bzAnim);bzAnim=null;}
  if(bzAnim2){cancelAnimationFrame(bzAnim2);bzAnim2=null;}
  applyTX('instant');
  updateLabels();
  bzSyncSlots();
  bzUpdate(true);
  bzUpdate2(true);
  updateWallClocks();
}
function dragEnd(){
  if(!drag)return;drag=null;
  document.querySelectorAll('.tape').forEach(t=>{t.classList.remove('instant');t.classList.add('drift');});
  document.removeEventListener('mousemove',dragMove);
  document.removeEventListener('mouseup',  dragEnd);
  document.removeEventListener('touchmove',dragMove);
  document.removeEventListener('touchend', dragEnd);
}

/* ══════════════════════════════════
   CARD DRAG-AND-DROP REORDER
══════════════════════════════════ */
let dragId = null;

function cardDragStart(e, id){
  dragId = id;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', id);
  // slight delay so the card renders before going semi-transparent
  setTimeout(()=>{
    const el = document.querySelector(`.card[data-id="${id}"]`);
    if(el) el.classList.add('dragging');
  }, 0);
}

function cardDragOver(e, id){
  if(!dragId || dragId === id) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.card').forEach(c =>
    c.classList.remove('drag-over-top','drag-over-bot')
  );
  const rect = e.currentTarget.getBoundingClientRect();
  const inTop = e.clientY < rect.top + rect.height / 2;
  e.currentTarget.classList.add(inTop ? 'drag-over-top' : 'drag-over-bot');
}

function cardDragLeave(e){
  e.currentTarget.classList.remove('drag-over-top','drag-over-bot');
}

function cardDrop(e, targetId){
  e.preventDefault();
  if(!dragId || dragId === targetId) return;

  const rect = e.currentTarget.getBoundingClientRect();
  const insertBefore = e.clientY < rect.top + rect.height / 2;

  const si = cities.indexOf(dragId);
  cities.splice(si, 1);                        // remove first
  const ti = cities.indexOf(targetId);         // recompute after removal
  cities.splice(insertBefore ? ti : ti + 1, 0, dragId);

  saveCitiesToStorage();
  renderList();
  renderWallClocks();
}

function cardDragEnd(){
  dragId = null;
  document.querySelectorAll('.card').forEach(c =>
    c.classList.remove('dragging','drag-over-top','drag-over-bot')
  );
}

function openSearch(){
  searchRegion='ALL';
  document.getElementById('overlay').classList.remove('hidden');
  const inp=document.getElementById('sinp');inp.value='';
  setTimeout(()=>inp.focus(),40);renderSearch();
}
function closeSearch(){document.getElementById('overlay').classList.add('hidden');}
function bgClick(e){if(e.target===document.getElementById('overlay'))closeSearch();}
function renderSearch(){
  const q=document.getElementById('sinp').value.trim().toLowerCase();
  const el=document.getElementById('sres');
  const bar=document.getElementById('sregbar');
  const qDst=(q==='dst'||q==='서머타임'||q==='서머');
  const matchedAll=DB.filter(c=>!cities.includes(c.id)&&(
    !q||
    c.name.toLowerCase().includes(q)||
    c.en.toLowerCase().includes(q)||
    c.country.toLowerCase().includes(q)||
    c.region.toLowerCase().includes(q)||
    (qDst&&isDST(c.tz))
  ));

  const regCounts=new Map();
  REGIONS.forEach(r=>regCounts.set(r,0));
  matchedAll.forEach(c=>regCounts.set(c.region,(regCounts.get(c.region)||0)+1));

  if(searchRegion!=='ALL'&&(regCounts.get(searchRegion)||0)===0){
    searchRegion='ALL';
  }

  if(bar){
    let btns=`<button class="sregbtn${searchRegion==='ALL'?' active':''}" onclick="setSearchRegion('ALL')">전체 (${matchedAll.length})</button>`;
    REGIONS.forEach(r=>{
      const cnt=regCounts.get(r)||0;
      if(!cnt)return;
      btns+=`<button class="sregbtn${searchRegion===r?' active':''}" onclick="setSearchRegion('${r}')">${r} (${cnt})</button>`;
    });
    bar.innerHTML=btns;
  }

  const visible=searchRegion==='ALL'?matchedAll:matchedAll.filter(c=>c.region===searchRegion);
  if(!visible.length){el.innerHTML='<div class="sempty">검색 결과가 없습니다</div>';return;}

  const groups=new Map();
  REGIONS.forEach(r=>groups.set(r,[]));
  visible.forEach(c=>{
    if(!groups.has(c.region))groups.set(c.region,[]);
    groups.get(c.region).push(c);
  });

  let html='';
  groups.forEach((items,reg)=>{
    if(!items.length)return;
    html+=`<div class="sgrp"><span>${reg}</span><span class="sgrpcnt">${items.length}</span></div>`;
    html+=items.map(c=>{
      const p=getParts(c.tz);
      return`<div class="sitem" onclick="addCity('${c.id}')">
        <span class="sflag">${c.flag}</span>
        <div class="sinf">
          <div class="sname">${c.name} <span style="font-size:10px;color:var(--dim)">${c.en}</span></div>
          <div class="scountry">${c.country}</div>
        </div>
        <div class="smeta">
          ${p.dst?`<span class="dst-badge dst-badge-sm" title="서머타임(DST) 적용 중">${DST_ICON}DST</span>`:''}
          <span class="stime">${p.timeStr}</span>
        </div>
      </div>`;
    }).join('');
  });
  el.innerHTML=html;
}

const BZ_CITIES=[
  {tz:'Pacific/Pago_Pago',   name:'Samoa'},
  {tz:'Pacific/Honolulu',    name:'Honolulu'},
  {tz:'America/Anchorage',   name:'Anchorage'},
  {tz:'America/Los_Angeles', name:'L.A.'},
  {tz:'America/Denver',      name:'Denver'},
  {tz:'America/Chicago',     name:'Chicago'},
  {tz:'America/New_York',    name:'New York'},
  {tz:'America/Caracas',     name:'Caracas'},
  {tz:'America/Sao_Paulo',   name:'São Paulo'},
  {tz:'America/Noronha',     name:'Noronha'},
  {tz:'Atlantic/Azores',     name:'Azores'},
  {tz:'Europe/London',       name:'London'},
  {tz:'Europe/Paris',        name:'Paris'},
  {tz:'Africa/Cairo',        name:'Cairo'},
  {tz:'Europe/Moscow',       name:'Moscow'},
  {tz:'Asia/Dubai',          name:'Dubai'},
  {tz:'Asia/Karachi',        name:'Karachi'},
  {tz:'Asia/Dhaka',          name:'Dhaka'},
  {tz:'Asia/Bangkok',        name:'Bangkok'},
  {tz:'Asia/Shanghai',       name:'Beijing'},
  {tz:'Asia/Seoul',          name:'Seoul'},
  {tz:'Australia/Sydney',    name:'Sydney'},
  {tz:'Pacific/Noumea',      name:'Noumea'},
  {tz:'Pacific/Auckland',    name:'Auckland'},
];
const BZ_FALLBACK={'-9':'Gambier','-1':'C. Verde','0':'UTC','1':'Lagos','10':'Brisbane','12':'Fiji'};

let bzDeg=0;
let bzRenderedDeg=null;
let bzDragSt=null;
let bzAnim=null;
let bzDeg2=0;
let bzRenderedDeg2=null;
let bzDragSt2=null;
let bzAnim2=null;

function bzLiveOffset(tz,ts=selTime()){
  let off=Math.round(tzOffsetMin(ts,tz)/60);
  if(off>12)off-=24;
  if(off<=-12)off+=24;
  return off;
}

function getBezelSlots(ts=selTime()){
  const map=new Map();
  cities.forEach(id=>{
    const c=DB.find(x=>x.id===id);if(!c)return;
    const off=bzLiveOffset(c.tz,ts);
    if(!map.has(off))map.set(off,{offset:off,name:c.en,sel:true,dst:isDST(c.tz,ts)});
  });
  BZ_CITIES.forEach(d=>{
    const off=bzLiveOffset(d.tz,ts);
    if(!map.has(off))map.set(off,{offset:off,name:d.name,sel:false,dst:isDST(d.tz,ts)});
  });
  for(let off=-11;off<=12;off++){
    if(!map.has(off)){
      const fb=BZ_FALLBACK[String(off)]||(off>=0?`UTC+${off}`:`UTC${off}`);
      map.set(off,{offset:off,name:fb,sel:false,dst:false});
    }
  }
  return Array.from(map.values()).sort((a,b)=>a.offset-b.offset);
}

let bzSlotsBucket=null;
let bzSlotsSig='';
function bzSlotsSignature(slots){
  return slots.map(s=>`${s.offset}:${s.name}:${s.sel?1:0}:${s.dst?1:0}`).join('|');
}
function bzSyncSlots(ts=selTime()){
  if(bzDragSt||bzDragSt2)return;
  const bucket=Math.floor(ts/60000);
  if(bucket===bzSlotsBucket)return;
  bzSlotsBucket=bucket;
  const sig=bzSlotsSignature(getBezelSlots(ts));
  if(sig!==bzSlotsSig){
    bzSlotsSig=sig;
    buildBezelSVG();
    buildBezelSVG2();
  }
}

function bzUtcHours(ts=selTime()){
  const d=new Date(ts);
  return d.getUTCHours()+d.getUTCMinutes()/60+d.getUTCSeconds()/3600;
}

/* polar → SVG xy (0° = top/north, clockwise positive) */
function bzPt(angleDeg,r){
  const rad=(angleDeg-90)*Math.PI/180;
  return{x:Math.cos(rad)*r,y:Math.sin(rad)*r};
}

const BZ_FONT_COND="'Arial Narrow','Roboto Condensed','Helvetica Neue',Arial,sans-serif";
const BZ_FONT_SANS="Arial,'Helvetica Neue',sans-serif";
let bzMeasureCtx=null;
function bzMeasureText(text,fontSize,fontFamily,letterSpacingEm=0.04){
  if(!bzMeasureCtx&&typeof document!=='undefined'&&document.createElement){
    const cv=document.createElement('canvas');
    if(cv&&cv.getContext)bzMeasureCtx=cv.getContext('2d');
  }
  if(bzMeasureCtx){
    bzMeasureCtx.font=`700 ${fontSize}px ${fontFamily}`;
    const w=bzMeasureCtx.measureText(text).width;
    return w+Math.max(0,text.length-1)*fontSize*letterSpacingEm;
  }
  return text.length*fontSize*(0.56+letterSpacingEm);
}

function bzWatchMarkup(idPrefix,bezelId,cityCls,dialId,tickCls,lblId){
  const RC=258,RBO=250,RBI=166,R_OUT=226,R_IN=189;
  const RFC=162,RSO=162,RNM=137;
  const t=activeTheme;
  const ts=selTime();
  const slots=getBezelSlots(ts);
  bzSlotsSig=bzSlotsSignature(slots);
  bzSlotsBucket=Math.floor(ts/60000);

  let arcDefs='';
  const arcMeta=slots.map((c,idx)=>{
    const rawAng=((c.offset*15)%360+360)%360;
    const isOuterTrack=c.offset%2===0;
    const trackR=isOuterTrack?R_OUT:R_IN;
    const oppositeR=isOuterTrack?R_IN:R_OUT;
    const useClockwise=rawAng<=90||rawAng>=270;
    const a0=useClockwise?rawAng-60:rawAng+60;
    const a1=useClockwise?rawAng+60:rawAng-60;
    const p0=bzPt(a0,trackR),p1=bzPt(a1,trackR);
    const sweep=useClockwise?1:0;
    arcDefs+=`<path id="${idPrefix}-arc-${idx}" d="M ${p0.x.toFixed(2)},${p0.y.toFixed(2)} A ${trackR},${trackR} 0 0,${sweep} ${p1.x.toFixed(2)},${p1.y.toFixed(2)}"/>`;
    return{c,idx,rawAng,isOuterTrack,trackR,oppositeR};
  });

  let h=`<defs>
    <linearGradient id="${idPrefix}-steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="${t.steelStops[0]}"/>
      <stop offset="26%" stop-color="${t.steelStops[1]}"/>
      <stop offset="52%" stop-color="${t.steelStops[2]}"/>
      <stop offset="78%" stop-color="${t.steelStops[3]}"/>
      <stop offset="100%" stop-color="${t.steelStops[4]}"/>
    </linearGradient>
    <radialGradient id="${idPrefix}-ring" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="${t.bezelOuterColor}"/>
      <stop offset="100%" stop-color="${t.bezelInnerColor}"/>
    </radialGradient>
    <radialGradient id="${idPrefix}-face" cx="45%" cy="40%" r="61%">
      <stop offset="0%" stop-color="${t.centerFaceStops[0]}"/>
      <stop offset="62%" stop-color="${t.centerFaceStops[1]}"/>
      <stop offset="100%" stop-color="${t.centerFaceStops[2]}"/>
    </radialGradient>
    <linearGradient id="${idPrefix}-glass" x1="12%" y1="5%" x2="72%" y2="85%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.22)"/>
      <stop offset="55%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    ${arcDefs}
  </defs>`;

  /* 1. outer brushed steel case + 72 coin-edge knurled notches */
  h+=`<circle r="${RC}" fill="url(#${idPrefix}-steel)" stroke="${t.steelStops[3]}" stroke-width="1.5"/>`;
  h+=`<circle r="253" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1"/>`;
  for(let i=0;i<72;i++){
    const a=i*5;
    const n1=bzPt(a,251),n2=bzPt(a,256);
    h+=`<line x1="${n1.x.toFixed(2)}" y1="${n1.y.toFixed(2)}" x2="${n2.x.toFixed(2)}" y2="${n2.y.toFixed(2)}" stroke="${i%2?'rgba(255,255,255,.38)':'rgba(25,40,60,.28)'}" stroke-width="1.1"/>`;
  }

  /* 2. IWC-style staggered 2-track curved city bezel (DST highlighted by city color only) */
  h+=`<g id="${bezelId}">`;
  h+=`<circle r="${RBO}" fill="url(#${idPrefix}-ring)" stroke="${t.bezelBorderColor}" stroke-width="1.4"/>`;
  h+=`<circle r="${((R_OUT+R_IN)/2).toFixed(1)}" fill="none" stroke="${t.bezelTrackGuideColor}" stroke-width="0.7"/>`;
  h+=`<circle r="${RBI}" fill="${t.bezelInnerDiskColor}" stroke="url(#${idPrefix}-steel)" stroke-width="1.6"/>`;

  arcMeta.forEach(({c,idx,rawAng,isOuterTrack,oppositeR})=>{
    const isSeoul=c.name==='Seoul';
    const isHi=isSeoul||c.sel;
    const accent=isSeoul?t.seoulColor:(c.dst?t.dstColor:(c.sel?t.londonColor:null));
    const tickColor=accent||t.defaultCityTickColor;
    const textColor=accent||t.defaultCityTextColor;
    const dotColor=accent||t.defaultCityDotColor;
    const tickW=isHi?2.6:(c.dst?2.1:1.3);
    const t1=bzPt(rawAng,RBI+1),t2=bzPt(rawAng,RBI+6.5);
    h+=`<line x1="${t1.x.toFixed(2)}" y1="${t1.y.toFixed(2)}" x2="${t2.x.toFixed(2)}" y2="${t2.y.toFixed(2)}" stroke="${tickColor}" stroke-width="${tickW}"/>`;

    const upperName=c.name.toUpperCase();
    let textSize=(isHi||c.dst)?22:20;
    const maxArcW=isOuterTrack?94:78;
    const measuredW=bzMeasureText(upperName,textSize,BZ_FONT_COND,0.04);
    if(measuredW>maxArcW)textSize*=maxArcW/measuredW;
    const titleTxt=c.dst?`${c.name} · 서머타임(DST) 적용 중`:c.name;

    h+=`<text class="${cityCls}" data-offset="${c.offset}"
      font-size="${textSize.toFixed(2)}" font-weight="700"
      font-family="${BZ_FONT_COND}" fill="${textColor}"
      letter-spacing="0.04em" text-anchor="middle" dominant-baseline="central"><title>${titleTxt}</title><textPath href="#${idPrefix}-arc-${idx}" startOffset="50%">${upperName}</textPath></text>`;

    const dp=bzPt(rawAng,oppositeR);
    const dotR=isHi?3.4:(c.dst?3.0:2.6);
    h+=`<circle cx="${dp.x.toFixed(2)}" cy="${dp.y.toFixed(2)}" r="${dotR}" fill="${dotColor}"/>`;
  });
  h+=`</g>`;

  /* 3. two-tone day/night 24h dial (06-18 day, 18-06 night) */
  const pDay=bzPt(90,RFC),pNit=bzPt(270,RFC);
  if(dialId)h+=`<g id="${dialId}">`;
  h+=`<path d="M 0,0 L ${pDay.x.toFixed(2)},${pDay.y.toFixed(2)} A ${RFC},${RFC} 0 0,1 ${pNit.x.toFixed(2)},${pNit.y.toFixed(2)} Z" fill="${t.dayHalfColor}"/>`;
  h+=`<path d="M 0,0 L ${pNit.x.toFixed(2)},${pNit.y.toFixed(2)} A ${RFC},${RFC} 0 0,1 ${pDay.x.toFixed(2)},${pDay.y.toFixed(2)} Z" fill="${t.nightHalfColor}"/>`;
  h+=`<circle r="${RFC}" fill="none" stroke="url(#${idPrefix}-steel)" stroke-width="2"/>`;

  for(let hr=0;hr<24;hr++){
    const ang=hr*15;
    const isHorizon=hr===6||hr===18;
    const isDay=hr>6&&hr<18;
    const maj=hr%6===0,mid=hr===0||hr===12;
    const tO=bzPt(ang,RSO),tI=bzPt(ang,maj?154:157);
    const sc=isHorizon?t.dayMajorNumColor:isDay?((mid||maj)?t.dayMajorNumColor:t.dayMinorTickColor):((mid||maj)?t.nightMajorNumColor:t.nightMinorTickColor);
    const tsw=mid?2.4:maj?1.8:1.1;
    h+=`<line x1="${tO.x.toFixed(2)}" y1="${tO.y.toFixed(2)}" x2="${tI.x.toFixed(2)}" y2="${tI.y.toFixed(2)}" stroke="${sc}" stroke-width="${tsw}"/>`;
    const np=bzPt(ang,RNM);
    const numFill=(isHorizon||isDay)?t.dayMajorNumColor:t.nightMajorNumColor;
    const numHalo=isHorizon?` stroke="${t.dayHalfColor}" stroke-width="3.2" paint-order="stroke" stroke-linejoin="round"`:'';
    h+=`<text${tickCls?` class="${tickCls}"`:''} x="${np.x.toFixed(2)}" y="${np.y.toFixed(2)}"
      text-anchor="middle" dominant-baseline="middle"
      font-size="${maj?23:20}" font-weight="700"
      font-family="${BZ_FONT_COND}"
      fill="${numFill}"${numHalo}>${String(hr).padStart(2,'0')}</text>`;
  }
  if(dialId)h+=`</g>`;

  /* 4. inner stepped chapter ring + sunburst center dial + 12 baton markers */
  h+=`<circle r="112" fill="none" stroke="url(#${idPrefix}-steel)" stroke-width="3.2"/>`;
  h+=`<circle r="110" fill="none" stroke="rgba(19,32,48,.18)" stroke-width="1"/>`;
  h+=`<circle r="108" fill="url(#${idPrefix}-face)"/>`;
  h+=`<circle r="101" fill="none" stroke="${t.centerTimeColor}" stroke-opacity="0.09" stroke-width="0.7"/>`;
  h+=`<circle r="91" fill="none" stroke="${t.centerTimeColor}" stroke-opacity="0.06" stroke-width="0.7"/>`;

  for(let h12=0;h12<12;h12++){
    const a=h12*30;
    const b1=bzPt(a,97),b2=bzPt(a,105);
    h+=`<line x1="${b1.x.toFixed(2)}" y1="${b1.y.toFixed(2)}" x2="${b2.x.toFixed(2)}" y2="${b2.y.toFixed(2)}" stroke="${h12%3===0?t.batonCardinalColor:t.batonMinorColor}" stroke-width="${h12%3===0?'2.2':'1.3'}" stroke-linecap="round"/>`;
  }

  /* 5. center Seoul digital readout + subtle sapphire glass sheen */
  h+=`<text x="0" y="-36" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="700" fill="${t.centerCityColor}" font-family="${BZ_FONT_SANS}" letter-spacing="2.5">SEOUL</text>`;
  h+=`<text id="${lblId}" x="0" y="2" text-anchor="middle" dominant-baseline="middle" font-size="38" font-weight="700" fill="${t.centerTimeColor}" font-family="${BZ_FONT_COND}" letter-spacing="1.2" style="font-variant-numeric:tabular-nums">00:00:00</text>`;
  h+=`<text x="0" y="38" text-anchor="middle" dominant-baseline="middle" font-size="15.5" font-weight="700" fill="${t.centerUtcColor}" font-family="${BZ_FONT_SANS}" letter-spacing="1.2">UTC+9</text>`;
  h+=`<path d="M -90,-56 C -57,-106 20,-112 66,-83 C 25,-44 -35,-27 -90,-56 Z" fill="url(#${idPrefix}-glass)" pointer-events="none"/>`;

  return h;
}

function bzSeoulFromDeg(deg){
  /* Seoul (UTC+9) label on bezel points to inner scale hour = (9 + deg/15) mod 24 */
  const totalSec=Math.round((((9+deg/15)%24+24)%24)*3600)%86400;
  const hh=Math.floor(totalSec/3600);
  const mm=Math.floor((totalSec%3600)/60);
  const ss=totalSec%60;
  return`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
}

function bzSeoulFromDeg2(deg){
  /* Fixed Seoul (UTC+9) aligns with rotated dial hour = (9 - deg/15) mod 24 */
  const totalSec=Math.round((((9-deg/15)%24+24)%24)*3600)%86400;
  const hh=Math.floor(totalSec/3600);
  const mm=Math.floor((totalSec%3600)/60);
  const ss=totalSec%60;
  return`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
}

function bzApplyDeg(deg,force=false){
  bzDeg=((deg%360)+360)%360;
  /* update center Seoul display */
  const sl=document.getElementById('bzSeoulLbl');
  if(sl)sl.textContent=bzSeoulFromDeg(bzDeg);
  const diff=bzRenderedDeg===null?Infinity:Math.abs(bzDeg-bzRenderedDeg);
  if(!force&&Math.min(diff,360-diff)<0.1)return;
  const bezel=document.getElementById('bzBezel');if(!bezel)return;
  bezel.setAttribute('transform',`rotate(${bzDeg.toFixed(3)})`);
  bzRenderedDeg=bzDeg;
}

function bzApplyDeg2(deg,force=false){
  bzDeg2=((deg%360)+360)%360;
  const sl=document.getElementById('bzSeoulLbl2');
  if(sl)sl.textContent=bzSeoulFromDeg2(bzDeg2);
  const diff=bzRenderedDeg2===null?Infinity:Math.abs(bzDeg2-bzRenderedDeg2);
  if(!force&&Math.min(diff,360-diff)<0.1)return;
  const dial=document.getElementById('bzDial2');if(!dial)return;
  dial.setAttribute('transform',`rotate(${bzDeg2.toFixed(3)})`);
  document.querySelectorAll('.bztick2').forEach(lbl=>{
    const cx=parseFloat(lbl.getAttribute('x'));
    const cy=parseFloat(lbl.getAttribute('y'));
    lbl.setAttribute('transform',`rotate(${(-bzDeg2).toFixed(3)},${cx},${cy})`);
  });
  bzRenderedDeg2=bzDeg2;
}

function bzGetAngle(e,svg){
  const r=svg.getBoundingClientRect();
  const cx=r.left+r.width/2,cy=r.top+r.height/2;
  const pt=e.touches?e.touches[0]:e;
  return Math.atan2(pt.clientY-cy,pt.clientX-cx)*180/Math.PI;
}

function bzUpdate(force=false){
  if(bzDragSt||bzAnim)return;
  const utcH=bzUtcHours(selTime());
  bzApplyDeg(utcH*15,force);
}

function bzUpdate2(force=false){
  if(bzDragSt2||bzAnim2)return;
  const utcH=bzUtcHours(selTime());
  bzApplyDeg2(-utcH*15,force);
}

function bzAnimateTo(targetDeg,duration=1000){
  if(bzAnim){cancelAnimationFrame(bzAnim);bzAnim=null;}
  const startDeg=bzDeg;
  const delta=((targetDeg-startDeg+540)%360)-180;
  if(Math.abs(delta)<0.5){bzApplyDeg(targetDeg,true);return;}
  const t0=performance.now();
  function step(now){
    const t=Math.min(1,(now-t0)/duration);
    const ease=1-Math.pow(1-t,3);
    bzApplyDeg(startDeg+delta*ease,true);
    if(t<1){bzAnim=requestAnimationFrame(step);}
    else{bzAnim=null;bzUpdate(true);}
  }
  bzAnim=requestAnimationFrame(step);
}

function bzAnimateTo2(targetDeg,duration=1000){
  if(bzAnim2){cancelAnimationFrame(bzAnim2);bzAnim2=null;}
  const startDeg=bzDeg2;
  const delta=((targetDeg-startDeg+540)%360)-180;
  if(Math.abs(delta)<0.5){bzApplyDeg2(targetDeg,true);return;}
  const t0=performance.now();
  function step(now){
    const t=Math.min(1,(now-t0)/duration);
    const ease=1-Math.pow(1-t,3);
    bzApplyDeg2(startDeg+delta*ease,true);
    if(t<1){bzAnim2=requestAnimationFrame(step);}
    else{bzAnim2=null;bzUpdate2(true);}
  }
  bzAnim2=requestAnimationFrame(step);
}

function bzDragStart(e){
  e.preventDefault();
  if(bzAnim){cancelAnimationFrame(bzAnim);bzAnim=null;}
  if(bzAnim2){cancelAnimationFrame(bzAnim2);bzAnim2=null;}
  const svg=document.getElementById('bzSVG');
  bzDragSt={prevA:bzGetAngle(e,svg),accDeg:0,startOff:offsetMin};
  document.addEventListener('mousemove',bzDragMove);
  document.addEventListener('mouseup',bzDragEnd);
  document.addEventListener('touchmove',bzDragMove,{passive:false});
  document.addEventListener('touchend',bzDragEnd);
}
function bzDragMove(e){
  if(!bzDragSt)return;e.preventDefault();
  const svg=document.getElementById('bzSVG');
  const curA=bzGetAngle(e,svg);
  const step=((curA-bzDragSt.prevA+540)%360)-180;
  bzDragSt.accDeg+=step;
  bzDragSt.prevA=curA;
  offsetMin=Math.max(-1440,Math.min(1440,bzDragSt.startOff+Math.round(bzDragSt.accDeg*4)));
  document.getElementById('slider').value=offsetMin;
  applyTX('instant');
  updateLabels();
  updateWallClocks();
  const utcH=bzUtcHours(selTime());
  bzApplyDeg(utcH*15,true);
  bzApplyDeg2(-utcH*15,true);
}
function bzDragEnd(){
  bzDragSt=null;
  document.querySelectorAll('.tape').forEach(t=>{t.classList.remove('instant');t.classList.add('drift');});
  document.removeEventListener('mousemove',bzDragMove);
  document.removeEventListener('mouseup',bzDragEnd);

/* ══════════════════════════════════
   NEWSROOM WALL CLOCKS
══════════════════════════════════ */
let wallProj=null;

function drawWallMap(){
  const canvas=document.getElementById('wallMapCanvas');
  if(!canvas||!mapTopo)return;
  const wrap=canvas.parentElement;
  const W=wrap.clientWidth||window.innerWidth||960;
  const padLeft=4, padRight=8, padY=10;

  const landGeoms=mapTopo.objects.countries.geometries.filter(g=>g.id!=='010');
  const land=topojson.merge(mapTopo,landGeoms);
  const fitLand={
    type:'MultiPolygon',
    coordinates:land.coordinates.filter(poly=>
      !poly[0].every(([lon,lat])=>lon>-165&&lon<-150&&lat>15&&lat<30)
    )
  };
  wallProj=d3.geoNaturalEarth1().rotate([-11,0]).fitWidth(W-padLeft-padRight,fitLand);
  const [[x0,y0],[x1,y1]]=d3.geoPath().projection(wallProj).bounds(fitLand);
  const H=Math.max(180,Math.ceil(y1-y0))+padY*2;
  const [tx,ty]=wallProj.translate();
  wallProj.translate([tx+(padLeft-x0),ty+(padY-y0)]);

  wrap.style.height=`${H}px`;
  const dpr=window.devicePixelRatio||1;
  canvas.width=Math.round(W*dpr);
  canvas.height=Math.round(H*dpr);

  const ctx=canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);

  const path=d3.geoPath().projection(wallProj).context(ctx);
  ctx.fillStyle=activeTheme.isDark?'#2d3b4a':'#cfd6de';
  ctx.beginPath();
  path(land);
  ctx.fill();

  renderWallClocks();
}

function buildWallClockSVG(id,size){
  let ticks='';
  for(let i=0;i<60;i++){
    const rad=(i*6-90)*Math.PI/180;
    const isHr=i%5===0;
    const r1=isHr?38.2:40.2;
    const r2=42;
    const x1=(Math.cos(rad)*r1).toFixed(2), y1=(Math.sin(rad)*r1).toFixed(2);
    const x2=(Math.cos(rad)*r2).toFixed(2), y2=(Math.sin(rad)*r2).toFixed(2);
    ticks+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${isHr?'#1a2430':'#7a8694'}" stroke-width="${isHr?'1.4':'0.7'}"/>`;
  }
  let nums='';
  for(let n=1;n<=12;n++){
    const rad=(n*30-90)*Math.PI/180;
    const r=32;
    const nx=(Math.cos(rad)*r).toFixed(2), ny=(Math.sin(rad)*r).toFixed(2);
    nums+=`<text x="${nx}" y="${ny}" text-anchor="middle" dominant-baseline="central" font-size="8.5" font-weight="600" font-family="Arial,sans-serif" fill="#1a2430">${n}</text>`;
  }
  return`<svg class="wclock-svg" style="width:${size}px;height:${size}px" viewBox="-54 -54 108 108" xmlns="http://www.w3.org/2000/svg" aria-label="${id}">
    <defs>
      <linearGradient id="wcRim-${id}" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#f4f6f8"/>
        <stop offset="28%" stop-color="#b8c0c8"/>
        <stop offset="55%" stop-color="#eef2f5"/>
        <stop offset="82%" stop-color="#8e98a2"/>
        <stop offset="100%" stop-color="#dce2e8"/>
      </linearGradient>
    </defs>
    <circle r="51" fill="url(#wcRim-${id})" stroke="#9ba4ae" stroke-width="0.8"/>
    <circle r="45.5" fill="#d0d6dc" stroke="#8c96a0" stroke-width="0.6"/>
    <circle r="43.5" fill="#ffffff"/>
    ${ticks}
    ${nums}
    <line id="wc-h-${id}" x1="0" y1="4" x2="0" y2="-22" stroke="#18222d" stroke-width="3" stroke-linecap="round"/>
    <line id="wc-m-${id}" x1="0" y1="5" x2="0" y2="-33" stroke="#18222d" stroke-width="2" stroke-linecap="round"/>
    <line id="wc-s-${id}" x1="0" y1="7" x2="0" y2="-36" stroke="#d05808" stroke-width="0.9" stroke-linecap="round"/>
    <circle r="2.6" fill="#18222d"/>
    <circle r="1.1" fill="#d05808"/>
  </svg>`;
}

function renderWallClocks(){
  const el=document.getElementById('wallClocks');
  const ldr=document.getElementById('wallLeaders');
  if(!el)return;
  const wrap=el.parentElement;
  const W=wrap.clientWidth||window.innerWidth||960;
  const H=wrap.clientHeight||Math.round(W/2.25);

  const list=cities.map(id=>DB.find(x=>x.id===id)).filter(Boolean);
  if(!list.length){
    el.innerHTML='';
    if(ldr)ldr.innerHTML='';
    return;
  }

  const maxByH=Math.max(54,Math.round((H-68)*0.45));
  let D=Math.max(81,Math.min(138,Math.round(W*0.102)));
  D=Math.min(D,maxByH);
  if(list.length>8)D=Math.max(60,Math.round(D*Math.sqrt(8/list.length)));

  const labelH=Math.round(Math.max(50,Math.min(64,D*0.44)));
  const boxW=Math.max(D+20,104);
  const boxH=D+labelH+8;
  const rx=boxW/2+3;
  const ry=boxH/2+3;
  const minX=boxW/2+6;
  const maxX=Math.max(minX,W-boxW/2-6);
  const minY=boxH/2+6;
  const maxY=Math.max(minY,H-boxH/2-6);
  const clampX=v=>Math.max(minX,Math.min(maxX,v));
  const clampY=v=>Math.max(minY,Math.min(maxY,v));

  const nodes=list.map((c,idx)=>{
    let tx=(idx+0.5)/list.length*W, ty=H*0.5;
    if(wallProj){
      const pt=wallProj([c.lon,c.lat]);
      if(pt){tx=pt[0];ty=pt[1];}
    }
    return{c,tx,ty,x:clampX(tx),y:clampY(ty)};
  });

  const iters=120;
  for(let iter=0;iter<iters;iter++){
    for(let i=0;i<nodes.length;i++){
      for(let j=i+1;j<nodes.length;j++){
        const ni=nodes[i], nj=nodes[j];
        let dx=nj.x-ni.x, dy=nj.y-ni.y;
        if(Math.hypot(dx,dy)<0.01){
          const a=((i*7+j*13)%12)*Math.PI/6;
          dx=Math.cos(a)*0.5;
          dy=Math.sin(a)*0.5;
        }
        const nx=dx/(2*rx), ny=dy/(2*ry);
        const dist=Math.hypot(nx,ny);
        if(dist<1){
          const push=(1-dist)*0.55;
          const ux=(nx/dist)*push*(2*rx);
          const uy=(ny/dist)*push*(2*ry);
          ni.x-=ux*0.5; ni.y-=uy*0.5;
          nj.x+=ux*0.5; nj.y+=uy*0.5;
        }
      }
    }
    if(iter<85){
      const k=0.06*(1-iter/85);
      for(let i=0;i<nodes.length;i++){
        const n=nodes[i];
        n.x+=(clampX(n.tx)-n.x)*k;
        n.y+=(clampY(n.ty)-n.y)*k;
      }
    }
    for(let i=0;i<nodes.length;i++){
      nodes[i].x=clampX(nodes[i].x);
      nodes[i].y=clampY(nodes[i].y);
    }
  }

  if(ldr){
    ldr.setAttribute('viewBox',`0 0 ${W} ${H}`);
    ldr.innerHTML=nodes.map(n=>{
      if(Math.hypot(n.x-n.tx,n.y-n.ty)<=D*0.45)return'';
      const pinX=Math.max(4,Math.min(W-4,n.tx));
      const pinY=Math.max(4,Math.min(H-4,n.ty));
      return`<line x1="${pinX.toFixed(1)}" y1="${pinY.toFixed(1)}" x2="${n.x.toFixed(1)}" y2="${n.y.toFixed(1)}" stroke="rgba(90,122,144,.42)" stroke-width="1.2" stroke-dasharray="3,3"/>`
        +`<circle cx="${pinX.toFixed(1)}" cy="${pinY.toFixed(1)}" r="2.8" fill="#d05808" stroke="#fff" stroke-width="1"/>`;
    }).join('');
  }

  el.innerHTML=nodes.map(n=>`<div class="wclock" id="wc-wrap-${n.c.id}" style="left:${n.x.toFixed(1)}px;top:${n.y.toFixed(1)}px" title="${n.c.name} (${n.c.en})">
    ${buildWallClockSVG(n.c.id,D)}
    <div class="wclock-lbl">${n.c.en}<sup class="wclock-dst" id="wc-dst-${n.c.id}" title="서머타임(DST) 적용 중" hidden>+DST</sup></div>
    <div class="wclock-dt">
      <div class="wclock-date" id="wc-d-${n.c.id}"></div>
      <div class="wclock-time" id="wc-t-${n.c.id}"></div>
    </div>
  </div>`).join('');

  updateWallClocks();
}

function updateWallClocks(){
  cities.forEach(id=>{
    const c=DB.find(x=>x.id===id);if(!c)return;
    const p=getParts(c.tz);
    const sDeg=p.s*6;
    const mDeg=p.m*6+p.s*0.1;
    const hDeg=((p.h%12)+p.m/60+p.s/3600)*30;
    const sh=document.getElementById(`wc-h-${c.id}`);
    const sm=document.getElementById(`wc-m-${c.id}`);
    const ss=document.getElementById(`wc-s-${c.id}`);
    const sd=document.getElementById(`wc-d-${c.id}`);
    const st=document.getElementById(`wc-t-${c.id}`);
    const sw=document.getElementById(`wc-wrap-${c.id}`);
    const sdst=document.getElementById(`wc-dst-${c.id}`);
    if(sh)sh.setAttribute('transform',`rotate(${hDeg.toFixed(2)})`);
    if(sm)sm.setAttribute('transform',`rotate(${mDeg.toFixed(2)})`);
    if(ss)ss.setAttribute('transform',`rotate(${sDeg.toFixed(2)})`);
    if(sd)sd.textContent=p.dateStrEn;
    if(st)st.textContent=`${p.timeStr}:${p.secStr}`;
    if(sw)sw.title=p.dst?`${c.name} (${c.en}) · 서머타임(DST) 적용 중`:`${c.name} (${c.en})`;
    if(sdst)sdst.hidden=!p.dst;
  });
}
