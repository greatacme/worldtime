<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Time — 뉴스룸 벽시계</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon-32x32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<style>
:root {
  --page:    #eef3f9;
  --hdr:     #ffffff;
  --card:    #ffffff;
  --lpanel:  #f4f8fc;
  --text:    #18303f;
  --dim:     #5a7a90;
  --border:  rgba(30,80,130,.12);
  --shadow:  0 2px 14px rgba(30,80,130,.09);
  --accent:  #1260a0;
  --acc2:    #1580cc;
  --orange:  #d05808;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

body{
  height:100vh;
  height:100dvh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  background:#ffffff;
  color:var(--text);
  font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
}

/* ── MAP & WALL CLOCKS STAGE ── */
.wallstage{
  flex:1;
  min-height:220px;
  position:relative;
  background:#ffffff;
  overflow:hidden;
}
.wallwrap{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
}
#wallMapCanvas{
  display:block;
  width:100%;
  height:100%;
}
#wallLeaders{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
}
#wallClocks{
  position:absolute;
  inset:0;
  pointer-events:none;
}
.wclock{
  position:absolute;
  transform:translate(-50%,-50%);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  pointer-events:auto;
}
.wclock-svg{
  display:block;
  filter:drop-shadow(0 4px 10px rgba(20,40,65,.18));
}
.wclock-lbl{
  font-size:clamp(11px,1.05vw,14px);
  font-weight:700;
  color:#182b3a;
  letter-spacing:.2px;
  white-space:nowrap;
  background:rgba(255,255,255,.84);
  padding:1px 7px;
  border-radius:10px;
  line-height:1.25;
}
.wclock-dt{
  display:flex;
  flex-direction:column;
  align-items:center;
  background:rgba(255,255,255,.86);
  padding:1px 7px 2px;
  border-radius:8px;
  line-height:1.2;
}
.wclock-date{
  font-size:clamp(9.5px,0.85vw,11.5px);
  color:var(--dim);
  white-space:nowrap;
}
.wclock-time{
  font-size:clamp(11px,1vw,13.5px);
  font-weight:700;
  color:var(--accent);
  font-variant-numeric:tabular-nums;
  letter-spacing:.3px;
  white-space:nowrap;
}
.wall-empty{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:12px;
  pointer-events:auto;
  color:var(--dim);
  font-size:14px;
}

/* ── BOTTOM CITY SETTINGS BAR ── */
.citybar{
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 20px;
  background:#f8fbfe;
  border-top:1px solid var(--border);
  box-shadow:0 -2px 10px rgba(30,80,130,.05);
}
.citybar.collapsed{
  display:none;
}
.citybar-head{
  display:flex;
  align-items:center;
  gap:6px;
  flex-shrink:0;
}
.citybar-title{
  font-size:12px;
  font-weight:700;
  color:var(--dim);
  white-space:nowrap;
}
.citybar-cnt{
  font-size:11px;
  font-weight:700;
  color:var(--accent);
  background:#e6f0fa;
  padding:1px 7px;
  border-radius:10px;
  font-variant-numeric:tabular-nums;
}
.citybar-chips{
  flex:1;
  min-width:0;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:6px;
  max-height:92px;
  overflow-y:auto;
}
.citybar-empty{
  font-size:12px;
  color:var(--dim);
}
.cchip{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:4px 8px 4px 7px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:18px;
  box-shadow:0 1px 4px rgba(30,80,130,.07);
  font-size:12px;
  user-select:none;
  cursor:grab;
}
.cchip:active{cursor:grabbing}
.cchip.dragging{opacity:.35;box-shadow:none}
.cchip.drag-over-left{box-shadow:-3px 0 0 var(--accent)}
.cchip.drag-over-right{box-shadow:3px 0 0 var(--accent)}
.cchip-drag{color:var(--dim);opacity:.5;font-size:12px;line-height:1}
.cchip-flag{font-size:14px;line-height:1}
.cchip-name{font-weight:600;color:var(--text);white-space:nowrap}
.cchip-rm{
  width:18px;
  height:18px;
  border-radius:50%;
  border:1px solid rgba(208,88,8,.35);
  background:transparent;
  color:var(--orange);
  cursor:pointer;
  font-size:13px;
  line-height:1;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  transition:background .15s;
}
.cchip-rm:hover{background:rgba(208,88,8,.12)}
.badd-pill{
  flex-shrink:0;
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 14px;
  border-radius:20px;
  border:1.5px solid var(--accent);
  background:#fff;
  color:var(--accent);
  font-size:12px;
  font-weight:700;
  cursor:pointer;
  transition:all .15s;
  white-space:nowrap;
}
.badd-pill:hover{
  background:var(--accent);
  color:#fff;
}
.badd-plus{
  font-size:15px;
  line-height:1;
}
.citybar-actions{
  display:flex;
  align-items:center;
  gap:6px;
  flex-shrink:0;
}
.btn-mini{
  padding:6px 11px;
  border-radius:20px;
  border:1px solid var(--border);
  background:#fff;
  color:var(--dim);
  font-size:11.5px;
  font-weight:700;
  cursor:pointer;
  transition:all .15s;
  white-space:nowrap;
}
.btn-mini:hover{
  border-color:var(--accent);
  color:var(--accent);
}
.btn-mini.active{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
}
.btn-mini.active:hover{
  background:var(--acc2);
  border-color:var(--acc2);
}
.btn-mini-link{
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  padding:6px 11px;
  border-radius:20px;
  border:1px solid var(--border);
  background:var(--lpanel);
  color:var(--text);
  font-size:11.5px;
  font-weight:700;
  transition:all .15s;
  white-space:nowrap;
}
.btn-mini-link:hover{
  border-color:var(--accent);
  color:var(--accent);
  background:#fff;
}
.fab-show{
  position:fixed;
  right:14px;
  bottom:14px;
  z-index:120;
  padding:6px 13px;
  border-radius:20px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.88);
  color:var(--dim);
  font-size:11.5px;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 2px 10px rgba(30,80,130,.12);
  opacity:.6;
  transition:all .15s;
}
.fab-show:hover{
  opacity:1;
  border-color:var(--accent);
  color:var(--accent);
}
.fab-show.hidden{
  display:none;
}

@media (max-width:640px){
  .citybar{flex-wrap:wrap;padding:8px 12px;gap:8px}
  .citybar-chips{order:3;flex-basis:100%;max-height:84px}
  .citybar-actions{margin-left:auto;flex-wrap:wrap}
  .btn-mini,.btn-mini-link,.badd-pill{padding:5px 10px;font-size:11px}
}

/* ── SEARCH MODAL ── */
.overlay{
  position:fixed;inset:0;
  background:rgba(15,40,65,.45);backdrop-filter:blur(4px);
  z-index:300;display:flex;align-items:flex-start;justify-content:center;
  padding-top:65px;
}
.overlay.hidden{display:none}
.sbox{
  background:#fff;border:1px solid var(--border);
  border-radius:12px;width:min(92vw,480px);max-height:min(82vh,580px);
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 24px 60px rgba(15,40,65,.2);
}
.shdr{
  display:flex;align-items:center;gap:8px;
  padding:12px 15px;border-bottom:1px solid var(--border);
}
.sinp{
  background:transparent;border:none;color:var(--text);
  font-size:14px;outline:none;flex:1;
}
.sinp::placeholder{color:var(--dim)}
.scls{background:none;border:none;color:var(--dim);font-size:18px;cursor:pointer}
.scls:hover{color:var(--text)}
.sregbar{
  display:flex;flex-wrap:wrap;gap:5px;
  padding:8px 12px;background:#f7fafd;
  border-bottom:1px solid var(--border);
}
.sregbtn{
  border:1px solid rgba(30,80,130,.18);background:#fff;color:var(--dim);
  border-radius:14px;padding:3px 9px;font-size:11px;font-weight:600;
  cursor:pointer;transition:all .12s;white-space:nowrap;
}
.sregbtn:hover{border-color:var(--accent);color:var(--accent)}
.sregbtn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.sres{overflow-y:auto;flex:1}
.sgrp{
  position:sticky;top:0;z-index:2;
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 15px;background:#eef4fa;
  border-top:1px solid rgba(30,80,130,.08);
  border-bottom:1px solid rgba(30,80,130,.1);
  font-size:11px;font-weight:700;color:#2b4c6b;letter-spacing:.2px;
}
.sgrpcnt{font-size:10px;font-weight:600;color:var(--dim)}
.sempty{padding:20px;text-align:center;color:var(--dim);font-size:12px}
.sitem{
  display:flex;align-items:center;gap:10px;
  padding:9px 15px;cursor:pointer;
  border-bottom:1px solid rgba(30,80,130,.06);transition:background .1s;
}
.sitem:hover{background:#f0f6ff}
.sflag{font-size:19px}
.sinf{flex:1}
.sname{font-size:13px;font-weight:600}
.scountry{font-size:10px;color:var(--dim)}
.stime{font-size:14px;font-weight:700;color:var(--acc2)}
</style>
</head>
<body>

<main class="wallstage">
  <div class="wallwrap" id="wallWrap">
    <canvas id="wallMapCanvas"></canvas>
    <svg id="wallLeaders"></svg>
    <div id="wallClocks"></div>
  </div>
</main>

<section class="citybar" id="cityBar" aria-label="도시 설정">
  <div class="citybar-head">
    <span class="citybar-title">도시 설정</span>
    <span class="citybar-cnt" id="cityCount">0</span>
  </div>
  <div class="citybar-chips" id="cityChips"></div>
  <div class="citybar-actions">
    <button type="button" class="badd-pill" onclick="openSearch()" title="도시 추가">
      <span class="badd-plus">+</span>
      <span>도시 추가</span>
    </button>
    <button type="button" class="btn-mini" id="btnFull" onclick="toggleFullscreen()" title="전체화면 전환">전체화면</button>
    <button type="button" class="btn-mini" onclick="toggleCityBar()" title="도시 설정 바 숨기기">숨기기</button>
    <a class="btn-mini-link" href="index.html" title="메인 화면으로 이동">메인</a>
  </div>
</section>

<button type="button" class="fab-show hidden" id="btnShowBar" onclick="toggleCityBar()" title="도시 설정 열기">도시 설정</button>

<div class="overlay hidden" id="overlay" onclick="bgClick(event)">
  <div class="sbox">
    <div class="shdr">
      <span style="color:var(--dim)">🔍</span>
      <input class="sinp" id="sinp" type="text"
        placeholder="도시, 국가, 지역 검색 (한국어 / English)..."
        oninput="renderSearch()" autocomplete="off">
      <button type="button" class="scls" onclick="closeSearch()">✕</button>
    </div>
    <div class="sregbar" id="sregbar"></div>
    <div class="sres" id="sres"></div>
  </div>
</div>

const STORAGE_KEY = 'worldtime_cities';
const DEFAULT_WALL_CITIES = ['seoul','tokyo','london','paris','newyork','sydney'];
const validIds = new Set(DB.map(c=>c.id));

let cities = [...DEFAULT_WALL_CITIES];

function saveCitiesToStorage(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(cities));
}

function loadCitiesFromStorage(){
  const saved = localStorage.getItem(STORAGE_KEY);
  if(saved !== null){
    try{
      const parsed = JSON.parse(saved);
      if(Array.isArray(parsed)){
        const seen = new Set();
        cities = parsed.filter(id=>validIds.has(id) && !seen.has(id) && seen.add(id));
        return;
      }
    }catch(e){
      console.error('Failed to load cities:', e);
    }
  }
  cities = [...DEFAULT_WALL_CITIES];
}

/* ══════════════════════════════════
   LIVE TIME HELPER
══════════════════════════════════ */
function getParts(tz){
  const now = new Date();
  const fmt = new Intl.DateTimeFormat('en-US',{
    timeZone:tz,hour12:false,
    year:'numeric',month:'2-digit',day:'2-digit',
    hour:'2-digit',minute:'2-digit',second:'2-digit',
    timeZoneName:'short'
  });
  const p={};
  fmt.formatToParts(now).forEach(x=>p[x.type]=x.value);
  let h=parseInt(p.hour,10);if(h===24)h=0;
  const m=parseInt(p.minute,10),s=parseInt(p.second,10);
  const wd=new Intl.DateTimeFormat('ko-KR',{timeZone:tz,weekday:'short'}).format(now).replace('요일','');
  const wdEn=new Intl.DateTimeFormat('en-US',{timeZone:tz,weekday:'short'}).format(now);
  const monEn=new Intl.DateTimeFormat('en-US',{timeZone:tz,month:'short'}).format(now);
  const tzAbbr=fmt.formatToParts(now).find(x=>x.type==='timeZoneName')?.value||'';
  return{
    h,m,s,
    timeStr:`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`,
    secStr:String(s).padStart(2,'0'),
    dateStr:`${p.month}-${p.day}(${wd})`,
    dateStrEn:`${monEn} ${p.day} (${wdEn})`,
    tzAbbr
  };
}

/* ══════════════════════════════════
   MAP — D3 Natural Earth projection
══════════════════════════════════ */
let mapTopo = null;
let mapLand = null;
let wallProj = null;

async function initMap(){
  try{
    mapTopo = await d3.json(
      'https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json'
    );
    const landGeoms = mapTopo.objects.countries.geometries.filter(g=>g.id!=='010');
    mapLand = topojson.merge(mapTopo, landGeoms);
    drawWallMap();
  }catch(e){
    console.warn('Map data load failed', e);
    renderWallClocks();
  }
}

function drawWallMap(){
  const canvas = document.getElementById('wallMapCanvas');
  if(!canvas||!mapLand)return;
  const wrap = canvas.parentElement;
  const W = wrap.clientWidth || window.innerWidth || 960;
  const H = wrap.clientHeight || Math.max(220, window.innerHeight - 60);
  const padLeft = 0;
  const padRight = 6;
  const padTop = 6;
  const padBottom = 6;

  wallProj = d3.geoNaturalEarth1()
    .rotate([-11,0])
    .fitExtent([[padLeft,padTop],[W-padRight,H-padBottom]], mapLand);

  const [[bx0],[bx1]] = d3.geoPath().projection(wallProj).bounds(mapLand);
  const spareW = Math.max(0, (W - padRight) - (bx1 - bx0));
  const targetLeft = padLeft + Math.round(spareW * 0.2);
  const [tx, ty] = wallProj.translate();
  wallProj.translate([tx + (targetLeft - bx0), ty]);

  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);

  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);

  const path = d3.geoPath().projection(wallProj).context(ctx);
  ctx.fillStyle = '#cfd6de';
  ctx.beginPath();
  path(mapLand);
  ctx.fill();

  renderWallClocks();
}

/* ══════════════════════════════════
   NEWSROOM WALL CLOCKS
══════════════════════════════════ */
function buildWallClockSVG(id,size){
  let ticks='';
  for(let i=0;i<60;i++){
    const rad=(i*6-90)*Math.PI/180;
    const isHr=i%5===0;
    const r1=isHr?38.2:40.2;
    const r2=42;
    const x1=(Math.cos(rad)*r1).toFixed(2), y1=(Math.sin(rad)*r1).toFixed(2);
    const x2=(Math.cos(rad)*r2).toFixed(2), y2=(Math.sin(rad)*r2).toFixed(2);
    ticks+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${isHr?'#1a2430':'#7a8694'}" stroke-width="${isHr?'1.4':'0.7'}"/>`;
  }
  let nums='';
  for(let n=1;n<=12;n++){
    const rad=(n*30-90)*Math.PI/180;
    const r=32;
    const nx=(Math.cos(rad)*r).toFixed(2), ny=(Math.sin(rad)*r).toFixed(2);
    nums+=`<text x="${nx}" y="${ny}" text-anchor="middle" dominant-baseline="central" font-size="8.5" font-weight="600" font-family="Arial,sans-serif" fill="#1a2430">${n}</text>`;
  }
  return`<svg class="wclock-svg" style="width:${size}px;height:${size}px" viewBox="-54 -54 108 108" xmlns="http://www.w3.org/2000/svg" aria-label="${id}">
    <defs>
      <linearGradient id="wcRim-${id}" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#f4f6f8"/>
        <stop offset="28%" stop-color="#b8c0c8"/>
        <stop offset="55%" stop-color="#eef2f5"/>
        <stop offset="82%" stop-color="#8e98a2"/>
        <stop offset="100%" stop-color="#dce2e8"/>
      </linearGradient>
    </defs>
    <circle r="51" fill="url(#wcRim-${id})" stroke="#9ba4ae" stroke-width="0.8"/>
    <circle r="45.5" fill="#d0d6dc" stroke="#8c96a0" stroke-width="0.6"/>
    <circle r="43.5" fill="#ffffff"/>
    ${ticks}
    ${nums}
    <line id="wc-h-${id}" x1="0" y1="4" x2="0" y2="-22" stroke="#18222d" stroke-width="3" stroke-linecap="round"/>
    <line id="wc-m-${id}" x1="0" y1="5" x2="0" y2="-33" stroke="#18222d" stroke-width="2" stroke-linecap="round"/>
    <line id="wc-s-${id}" x1="0" y1="7" x2="0" y2="-36" stroke="#d05808" stroke-width="0.9" stroke-linecap="round"/>
    <circle r="2.6" fill="#18222d"/>
    <circle r="1.1" fill="#d05808"/>
  </svg>`;
}

function renderWallClocks(){
  const el = document.getElementById('wallClocks');
  const ldr = document.getElementById('wallLeaders');
  if(!el)return;
  const wrap = el.parentElement;
  const W = wrap.clientWidth || window.innerWidth || 960;
  const H = wrap.clientHeight || Math.max(220, window.innerHeight - 60);

  const list = cities.map(id=>DB.find(x=>x.id===id)).filter(Boolean);
  if(!list.length){
    if(ldr)ldr.innerHTML='';
    el.innerHTML=`<div class="wall-empty">
      <span>표시할 도시가 없습니다.</span>
      <button type="button" class="badd-pill" onclick="openSearch()">
        <span class="badd-plus">+</span>
        <span>도시 추가</span>
      </button>
    </div>`;
    return;
  }

  const scaleBase = Math.min(W, H * 2.15);
  let D = Math.max(58, Math.min(116, Math.round(scaleBase * 0.074)));
  if(list.length > 7) D = Math.max(46, Math.round(D * Math.sqrt(7 / list.length)));

  const labelH = 54;
  const boxW = Math.max(D + 20, 96);
  const boxH = D + labelH + 8;
  const rx = boxW / 2 + 3;
  const ry = boxH / 2 + 3;
  const minX = boxW / 2 + 6;
  const maxX = Math.max(minX, W - boxW / 2 - 6);
  const minY = boxH / 2 + 6;
  const maxY = Math.max(minY, H - boxH / 2 - 6);
  const clampX = v => Math.max(minX, Math.min(maxX, v));
  const clampY = v => Math.max(minY, Math.min(maxY, v));

  const nodes = list.map((c,idx)=>{
    let tx = (idx + 0.5) / list.length * W;
    let ty = H * 0.5;
    if(wallProj){
      const pt = wallProj([c.lon, c.lat]);
      if(pt){tx = pt[0]; ty = pt[1];}
    }
    return{c,tx,ty,x:clampX(tx),y:clampY(ty)};
  });

  const iters = 120;
  for(let iter=0;iter<iters;iter++){
    for(let i=0;i<nodes.length;i++){
      for(let j=i+1;j<nodes.length;j++){
        const ni = nodes[i], nj = nodes[j];
        let dx = nj.x - ni.x, dy = nj.y - ni.y;
        if(Math.hypot(dx,dy) < 0.01){
          const a = ((i*7 + j*13) % 12) * Math.PI / 6;
          dx = Math.cos(a) * 0.5;
          dy = Math.sin(a) * 0.5;
        }
        const nx = dx / (2 * rx), ny = dy / (2 * ry);
        const dist = Math.hypot(nx,ny);
        if(dist < 1){
          const push = (1 - dist) * 0.55;
          const ux = (nx / dist) * push * (2 * rx);
          const uy = (ny / dist) * push * (2 * ry);
          ni.x -= ux * 0.5; ni.y -= uy * 0.5;
          nj.x += ux * 0.5; nj.y += uy * 0.5;
        }
      }
    }
    if(iter < 85){
      const k = 0.06 * (1 - iter / 85);
      for(let i=0;i<nodes.length;i++){
        const n = nodes[i];
        n.x += (clampX(n.tx) - n.x) * k;
        n.y += (clampY(n.ty) - n.y) * k;
      }
    }
    for(let i=0;i<nodes.length;i++){
      nodes[i].x = clampX(nodes[i].x);
      nodes[i].y = clampY(nodes[i].y);
    }
  }

  if(ldr){
    ldr.setAttribute('viewBox',`0 0 ${W} ${H}`);
    ldr.innerHTML=nodes.map(n=>{
      if(Math.hypot(n.x-n.tx,n.y-n.ty)<=D*0.45)return'';
      return`<line x1="${n.tx.toFixed(1)}" y1="${n.ty.toFixed(1)}" x2="${n.x.toFixed(1)}" y2="${n.y.toFixed(1)}" stroke="rgba(90,122,144,.42)" stroke-width="1.2" stroke-dasharray="3,3"/>`
        +`<circle cx="${n.tx.toFixed(1)}" cy="${n.ty.toFixed(1)}" r="2.8" fill="#d05808" stroke="#fff" stroke-width="1"/>`;
    }).join('');
  }

  el.innerHTML=nodes.map(n=>`<div class="wclock" style="left:${n.x.toFixed(1)}px;top:${n.y.toFixed(1)}px" title="${n.c.name} (${n.c.en})">
    ${buildWallClockSVG(n.c.id,D)}
    <div class="wclock-lbl">${n.c.en}</div>
    <div class="wclock-dt">
      <div class="wclock-date" id="wc-d-${n.c.id}"></div>
      <div class="wclock-time" id="wc-t-${n.c.id}"></div>
    </div>
  </div>`).join('');

  updateWallClocks();
}

function updateWallClocks(){
  cities.forEach(id=>{
    const c = DB.find(x=>x.id===id);if(!c)return;
    const p = getParts(c.tz);
    const sDeg = p.s * 6;
    const mDeg = p.m * 6 + p.s * 0.1;
    const hDeg = ((p.h % 12) + p.m / 60 + p.s / 3600) * 30;
    const sh = document.getElementById(`wc-h-${c.id}`);
    const sm = document.getElementById(`wc-m-${c.id}`);
    const ss = document.getElementById(`wc-s-${c.id}`);
    const sd = document.getElementById(`wc-d-${c.id}`);
    const st = document.getElementById(`wc-t-${c.id}`);
    if(sh)sh.setAttribute('transform',`rotate(${hDeg.toFixed(2)})`);
    if(sm)sm.setAttribute('transform',`rotate(${mDeg.toFixed(2)})`);
    if(ss)ss.setAttribute('transform',`rotate(${sDeg.toFixed(2)})`);
    if(sd)sd.textContent=p.dateStrEn;
    if(st)st.textContent=`${p.timeStr}:${p.secStr}`;
  });
}

let chipDragId = null;

function renderCityChips(){
  const el = document.getElementById('cityChips');

  if(cnt) cnt.textContent = String(cities.length);
  if(!el) return;
  if(!cities.length){

    return`<div class="cchip" draggable="true" data-id="${id}"
      ondragstart="chipDragStart(event,'${id}')"

      ondragleave="chipDragLeave(event)"
      ondrop="chipDrop(event,'${id}')"
      ondragend="chipDragEnd()"
      title="${c.name} (${c.en}) — 드래그하여 순서 변경">

function addCity(id){
  if(!validIds.has(id))return;
  if(!cities.includes(id)) cities.push(id);
  saveCitiesToStorage();
  closeSearch();
  renderCityChips();
  renderWallClocks();
}

function removeCity(id){
  cities = cities.filter(c=>c!==id);
  saveCitiesToStorage();
  renderCityChips();
  renderWallClocks();
}

function chipDragStart(e,id){
  chipDragId = id;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', id);
  setTimeout(()=>{
    const el = document.querySelector(`.cchip[data-id="${id}"]`);
    if(el) el.classList.add('dragging');
  }, 0);
}

function chipDragOver(e,id){
  if(!chipDragId || chipDragId===id)return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.cchip').forEach(c=>
    c.classList.remove('drag-over-left','drag-over-right')
  );
  const rect = e.currentTarget.getBoundingClientRect();
  const inLeft = e.clientX < rect.left + rect.width / 2;
  e.currentTarget.classList.add(inLeft ? 'drag-over-left' : 'drag-over-right');
}

function chipDragLeave(e){
  e.currentTarget.classList.remove('drag-over-left','drag-over-right');
}

function chipDrop(e,targetId){
  e.preventDefault();
  if(!chipDragId || chipDragId===targetId)return;
  const rect = e.currentTarget.getBoundingClientRect();
  const insertBefore = e.clientX < rect.left + rect.width / 2;
  const si = cities.indexOf(chipDragId);
  if(si === -1)return;
  cities.splice(si, 1);
  const ti = cities.indexOf(targetId);
  cities.splice(insertBefore ? ti : ti + 1, 0, chipDragId);
  chipDragId = null;
  saveCitiesToStorage();
  renderCityChips();
  renderWallClocks();
}

function chipDragEnd(){
  chipDragId = null;
  document.querySelectorAll('.cchip').forEach(c=>
    c.classList.remove('dragging','drag-over-left','drag-over-right')
  );
}

══════════════════════════════════ */
let searchRegion = 'ALL';

function setSearchRegion(reg){
  searchRegion = reg;
  renderSearch();
}

function openSearch(){
  searchRegion = 'ALL';
  document.getElementById('overlay').classList.remove('hidden');
  const inp = document.getElementById('sinp');
  inp.value = '';
  setTimeout(()=>inp.focus(), 40);
  renderSearch();
}

function closeSearch(){
  document.getElementById('overlay').classList.add('hidden');
}

function bgClick(e){
  if(e.target===document.getElementById('overlay')) closeSearch();
}

function renderSearch(){
  const q = document.getElementById('sinp').value.trim().toLowerCase();
  const el = document.getElementById('sres');
  const bar = document.getElementById('sregbar');
  const matchedAll = DB.filter(c=>!cities.includes(c.id)&&(
    !q||
    c.name.toLowerCase().includes(q)||
    c.en.toLowerCase().includes(q)||
    c.country.toLowerCase().includes(q)||
    c.region.toLowerCase().includes(q)
  ));

  const regCounts = new Map();
  REGIONS.forEach(r=>regCounts.set(r,0));
  matchedAll.forEach(c=>regCounts.set(c.region,(regCounts.get(c.region)||0)+1));

  if(searchRegion!=='ALL'&&(regCounts.get(searchRegion)||0)===0){
    searchRegion = 'ALL';
  }

  if(bar){
    let btns = `<button type="button" class="sregbtn${searchRegion==='ALL'?' active':''}" onclick="setSearchRegion('ALL')">전체 (${matchedAll.length})</button>`;
    REGIONS.forEach(r=>{
      const cnt = regCounts.get(r)||0;
      if(!cnt)return;
      btns+=`<button type="button" class="sregbtn${searchRegion===r?' active':''}" onclick="setSearchRegion('${r}')">${r} (${cnt})</button>`;
    });
    bar.innerHTML = btns;
  }

  const visible = searchRegion==='ALL' ? matchedAll : matchedAll.filter(c=>c.region===searchRegion);
  if(!visible.length){el.innerHTML='<div class="sempty">검색 결과가 없습니다</div>';return;}

  const groups = new Map();
  REGIONS.forEach(r=>groups.set(r,[]));
  visible.forEach(c=>{
    if(!groups.has(c.region))groups.set(c.region,[]);
    groups.get(c.region).push(c);
  });

  let html = '';
  groups.forEach((items,reg)=>{
    if(!items.length)return;
    html+=`<div class="sgrp"><span>${reg}</span><span class="sgrpcnt">${items.length}</span></div>`;
    html+=items.map(c=>{
      const p = getParts(c.tz);
      return`<div class="sitem" onclick="addCity('${c.id}')">
        <span class="sflag">${c.flag}</span>
        <div class="sinf">
          <div class="sname">${c.name} <span style="font-size:10px;color:var(--dim)">${c.en}</span></div>
          <div class="scountry">${c.country}</div>
        </div>
        <span class="stime">${p.timeStr}</span>
      </div>`;
    }).join('');
  });
  el.innerHTML = html;
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeSearch();
});

/* ══════════════════════════════════
   CONTROLS & RESIZE SYNC
══════════════════════════════════ */
let redrawRaf = null;

function scheduleRedraw(){
  if(redrawRaf) cancelAnimationFrame(redrawRaf);
  redrawRaf = requestAnimationFrame(()=>{
    redrawRaf = null;
    if(mapLand) drawWallMap();
    else renderWallClocks();
  });
}

function toggleCityBar(){
  const bar = document.getElementById('cityBar');
  const fab = document.getElementById('btnShowBar');
  if(!bar)return;
  const collapsed = bar.classList.toggle('collapsed');
  if(fab) fab.classList.toggle('hidden', !collapsed);
  scheduleRedraw();
}

function toggleFullscreen(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen?.().catch(err=>{
      console.warn('Fullscreen failed:', err);
    });
  }else{
    document.exitFullscreen?.().catch(err=>{
      console.warn('Exit fullscreen failed:', err);
    });
  }
}

function updateFullscreenBtn(){
  const btn = document.getElementById('btnFull');
  if(!btn)return;
  const isFull = !!document.fullscreenElement;
  btn.classList.toggle('active', isFull);
  btn.textContent = isFull ? '전체화면 종료' : '전체화면';
}

document.addEventListener('fullscreenchange',()=>{
  updateFullscreenBtn();
  scheduleRedraw();
});

window.addEventListener('storage',e=>{
  if(e.key===STORAGE_KEY || e.key===null){
    loadCitiesFromStorage();
    renderCityChips();
    renderWallClocks();
    if(!document.getElementById('overlay').classList.contains('hidden')){
      renderSearch();
    }
  }
});

/* ══════════════════════════════════
   INIT
══════════════════════════════════ */
document.addEventListener('DOMContentLoaded',()=>{
  loadCitiesFromStorage();
  renderCityChips();
  initMap();

  const wrap = document.getElementById('wallWrap');
  if(wrap && typeof ResizeObserver !== 'undefined'){
    new ResizeObserver(()=>scheduleRedraw()).observe(wrap);
  }
  window.addEventListener('resize', scheduleRedraw);
  setInterval(updateWallClocks, 1000);
});
</script>
</body>
</html>
